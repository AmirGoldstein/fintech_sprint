<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NVF Midterm Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: single centered column (max 640px), one question per screen, answer feedback inline under the options */
:root{
  color-scheme:light;
  --bg:#f6f5f8; --surface:#ffffff; --fg:#17151c; --muted:#5f5b69; --line:#e0dde6;
  --accent:#57068c; --accent-soft:#f1e9f7;
  --ok:#1d6b45; --ok-soft:#e5f2ea; --bad:#a3302a; --bad-soft:#f8e8e6;
  --s1:#57068c; --s2:#b56d0e; --s3:#23767d;
  --display:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --radius:14px;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{background:var(--bg);color:var(--fg)}
body{margin:0;font-family:var(--body);font-size:18px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 48px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
h1,h2{font-family:var(--display);font-weight:800;text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:2.15rem;line-height:1.15}
h2{font-size:1.6rem;line-height:1.2}
p{margin:0}
.label{font-size:.8rem;font-weight:600;letter-spacing:.02em;color:var(--muted)}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:0;border-radius:var(--radius);padding:14px 20px;font-weight:700;background:var(--accent);color:var(--bg);min-height:48px}
.btn.secondary{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row .btn{flex:1 1 180px}

/* home */
.intro{display:flex;flex-direction:column;gap:12px}
.rounds{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);overflow:hidden}
.round{display:grid;grid-template-columns:auto 1fr auto;gap:4px 14px;align-items:center;padding:16px;border-top:1px solid var(--line);text-align:left;background:transparent;border-left:0;border-right:0;border-bottom:0;width:100%}
.round:first-child{border-top:0}
.round:hover{background:var(--accent-soft)}
.round .rn{font-size:.85rem;font-weight:600;color:var(--muted);grid-row:span 2;min-width:3.6em}
.round .rt{font-weight:700;min-width:0}
.round .rs{font-size:.9rem;color:var(--muted);min-width:0}
.round .rscore{font-size:.85rem;grid-row:span 2;white-space:nowrap}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:.75rem;font-weight:600}
.pill.done{background:var(--ok-soft);color:var(--ok)}
.pill.todo{background:var(--accent-soft);color:var(--accent)}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.mode{display:flex;flex-direction:column;gap:2px;text-align:left;padding:14px 16px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
.mode:hover{border-color:var(--accent)}
.mode b{font-weight:700}
.mode small{color:var(--muted);font-size:.85rem}

/* quiz */
.top{display:flex;flex-direction:column;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-block:8px;z-index:2}
.topline{display:flex;justify-content:space-between;align-items:center;gap:12px}
.link{background:none;border:0;color:var(--accent);padding:6px 0;font-size:.9rem}
.bar{height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s ease}
.qcard{display:flex;flex-direction:column;gap:18px}
.kindrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.kind{font-size:.8rem;font-weight:700;color:var(--accent);letter-spacing:.02em}
.topic{font-size:.8rem;color:var(--muted)}
.trap{font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--bad-soft);color:var(--bad)}
.qtext{font-size:1.25rem;line-height:1.45;font-weight:600}
.case{padding:12px 14px;border-left:3px solid var(--accent);background:var(--surface);border-radius:0 var(--radius) var(--radius) 0;font-weight:400}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{font-weight:500;display:flex;gap:12px;align-items:flex-start;text-align:left;padding:14px 16px;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);min-height:52px;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt span{min-width:0}
.opt:disabled{cursor:default}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.dim{opacity:.55}
.feedback{display:flex;flex-direction:column;gap:10px;padding:14px 16px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--line)}
.feedback .verdict{font-weight:700}
.feedback.ok .verdict{color:var(--ok)}
.feedback.bad .verdict{color:var(--bad)}
.why{font-size:.95rem;padding-top:10px;border-top:1px solid var(--line)}
.why b{font-weight:700}
.mark{font-size:.92rem;padding:8px 12px;border-radius:10px;background:var(--accent-soft);color:var(--fg)}
.mark b{color:var(--accent);font-weight:700}

/* figures */
.fig{display:flex;flex-direction:column;gap:10px;padding:14px 16px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
.fig .ftitle{font-size:.85rem;font-weight:700;color:var(--muted)}
.fig .fnote{font-size:.78rem;color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:8px}
.brow{display:grid;grid-template-columns:minmax(0,9.5rem) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:.88rem}
.brow .bl{min-width:0;line-height:1.25}
.track{height:16px;background:var(--line);border-radius:4px;overflow:hidden}
.track i{display:block;height:100%;background:var(--s1);min-width:2px;border-radius:4px}
.brow.hl .track i{background:var(--s2)}
.brow .bv{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;font-size:.86rem;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl th{font-weight:700;color:var(--muted);font-size:.8rem}
.tbl tr.hl td{background:var(--accent-soft)}
.svgwrap svg{width:100%;height:auto;display:block;color:var(--fg)}
.svgwrap .ax{stroke:var(--line);stroke-width:1}
.svgwrap .zero{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.svgwrap text{fill:var(--muted);font-family:var(--body);font-size:19px}
.svgwrap text.sl{font-weight:700;font-size:21px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:3px;border-radius:2px;display:inline-block}

/* results */
.score{font-family:var(--display);font-weight:800;font-size:3rem;line-height:1;font-variant-numeric:tabular-nums}
.table{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
.trow{display:flex;justify-content:space-between;gap:12px;padding:12px 16px;border-top:1px solid var(--line)}
.trow:first-child{border-top:0}
.trow span:first-child{min-width:0}
.review{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.review li{padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.review b{display:block}
.review small{color:var(--muted);font-size:.9rem}
.clear{padding:14px 16px;border-radius:var(--radius);background:var(--ok-soft);color:var(--ok)}
.confirm{display:flex;flex-direction:column;gap:12px;padding:14px 16px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}

@media (max-width:420px){.brow{grid-template-columns:minmax(0,7rem) minmax(0,1fr) auto}.qtext{font-size:1.15rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

{r:0,k:"mc",t:"The donut",trap:1,

 q:"In an interview you describe a winning deal. Which word does the professor tell you never to use?",
 o:["Luck","Timing","Extrapolation","Capital flows"],a:0,
 ex:"Say timing, capital flows or correct deployment, and say 'extrapolation', not guessing. \"There are no bad ideas in tech, only bad timing\" (Marc Andreessen).",
 w:[null,"Timing is exactly the word he wants instead of luck.","He prefers 'extrapolation' to 'guessing'.","Capital flows is one of his preferred replacements for luck."]},
{r:0,k:"mc",t:"Return has four parts",
 q:"Return in VC is a function of which four things?",
 o:["Time, multiple, uncertainty and structure","Price, growth, margin and beta","Risk-free rate, beta, market premium and size","Revenue, EBITDA, cash and debt"],a:0,
 ex:"Return = f(Time + Structure + Multiple + Uncertainty). The IRR table captures time and multiple; structure is the term sheet (class 4).",
 w:[null,"These are operating drivers, not the components of a VC return.","That is a CAPM-style build-up, which doesn't fit illiquid, non-normal start-ups.","These are accounting lines. Early-stage companies often have none of them."]},
{r:0,k:"mc",t:"Survive like a cockroach",
 q:"Why does the professor say surviving 'like a cockroach' matters?",
 o:["Survival buys time, and time gives compounding and a chance at convexity","Survival protects the founder's reputation","Survival lets you avoid raising more money","Survival is required to keep the board seat"],a:0,
 ex:"Most start-ups die. Staying alive keeps the option open for the convex payoff that makes VC work."},
{r:0,k:"mc",t:"Negotiating leverage",
 q:"Risk and return have a third dimension in VC. What is it?",
 o:["Who holds negotiating leverage","Liquidity","Correlation with the S&P 500","The founder's age"],a:0,
 ex:"VCs held leverage when capital was scarce (2002–03, 2008–09, 2018). Founders hold it post-COVID and in 2026 AI. Always answer by context: year, interest rates and who can walk away.",
 w:[null,"Illiquidity is part of the return story, but his 'third dimension' is leverage.","Low correlation is why VC counts as an asset class, but it isn't the third dimension.","Founder age is a myth topic (average ~39), not a risk-return dimension."],
 m:"It depends on the sector and the context (year, interest rates, negotiating leverage)."},
{r:0,k:"case",t:"2026: founders hold leverage",
 c:"It's 2026. You want into a hot AI seed round, but you think the founder's price is too high. Ten other VCs are at the door.",
 q:"What is the realistic move?",
 o:["Take the price, or write a smaller check","Insist on a lower valuation and a week of extra due diligence","Ask for a full ratchet to compensate","Demand board control"],a:0,
 ex:"Capital is plentiful, so the founder sets the price. You can size down, for example $250K instead of $1M. In 2003 you could demand more diligence; today you ask gently for 30 more minutes.",
 w:[null,"That worked in Jan 2003, when capital was scarce. Today the founder walks to the next VC.","Onerous protection terms are another way of losing the deal in a founder-friendly market.","Control is not the point in VC, and no hot founder would accept it."]},
{r:0,k:"mc",t:"Adapt and learn to learn",
 q:"Hot sectors rotate. After e-retail, apps, crypto and AI, which sectors does the professor see next?",
 o:["Robotics, space and longevity","Social media and gaming","Real estate and retail","Commodities and shipping"],a:0,
 ex:"The best people adapt to markets, regulation and geography and reinvent themselves every 2–3 years. \"Learn to learn.\""},

/* ───────── Class 1 ───────── */
{r:1,k:"mc",t:"What a VC is",
 q:"Which is NOT part of the slide definition of a venture capitalist?",
 o:["Its primary goal is access to new technology","It invests LPs' money as a financial intermediary","It invests only in private companies","It takes an active role in monitoring and supporting the company"],a:0,
 ex:"The five parts: a financial intermediary, private companies only, an active role, a primary goal of financial return through an exit (IPO or sale), and funding internal growth. Corporates invest for technology; angels often invest for friendship.",
 w:[null,"This is part of the definition: VCs invest pensions', endowments', insurers' and wealthy individuals' money.","This is part of the definition.","This is part of the definition: a board seat or observer role."]},
{r:1,k:"case",t:"Primary vs secondary",
 c:"You buy Apple shares on Robinhood. Separately, your fund invests in a start-up's Series A.",
 q:"What is the key difference?",
 o:["The VC's cash goes onto the company's balance sheet for newly issued shares; on Robinhood you swap shares with another holder","There is no difference; both are equity purchases","The VC buys debt, Robinhood buys equity","The Robinhood purchase funds Apple's growth"],a:0,
 ex:"VC funds internal growth: debit cash, credit equity. That direct relationship with the company is why VC is hands-on.",
 w:[null,"Both are equity, but only the VC deal puts money into the company.","Seed and early VC is all equity (common or preferred), no debt.","A secondary trade moves money between shareholders, not to the company."]},
{r:1,k:"mc",t:"Knowledge arbitrage",
 q:"What is VC's unique source of advantage?",
 o:["Knowledge arbitrage: access and information before others","Capital structure arbitrage","Valuation arbitrage (long-short)","Cheap capital"],a:0,
 ex:"No debt in years 0–3 (no free cash flow, no collateral), and you can't short a start-up. Capital is plentiful. The edge is access, network and getting in early. Buyouts use capital structure; hedge funds use valuation.",
 w:[null,"That's the buyout model. Start-ups have no cash flow to service debt.","That's the hedge-fund model. You can't short a private start-up.","Capital is plentiful today; it isn't an edge."]},
{r:1,k:"tf",t:"No debt at seed",o:TF,a:1,
 q:"True or false: like buyout funds, VCs use leverage at the seed stage to boost returns.",
 ex:"There is no debt in years 0–3: no free cash flow to pay interest and no collateral. It's all equity, and equity can go to zero."},
{r:1,k:"mc",t:"Mark-to-market",
 q:"How often is a VC portfolio typically marked?",
 o:["Every 6–12 months, at new rounds or year-end 409A","Daily","Quarterly, using public comps","Only at exit"],a:0,
 ex:"Very limited marking is one reason hedge funds moved into VC: no daily red and green screens. Hedge funds mark daily; buyouts have limited marking.",
 w:[null,"Daily marking is the hedge-fund world.","There's no daily or quarterly market price for a start-up.","There are interim marks, at new rounds or year-end. They just aren't real until exit."]},
{r:1,k:"mc",t:"How big is VC",
 q:"How big is VC relative to the stock market?",
 o:["Under 10%","10–50%","50–100%","Larger than the stock market"],a:0,
 ex:"VC is tiny: under 10% of the stock market and about 12% of private equity. Private equity means any equity not listed on an exchange: buyouts, real estate, VC."},
{r:1,k:"tf",t:"Big companies are private",o:TF,a:0,
 q:"True or false: about 80% of US companies with $100M+ revenue are private.",
 ex:"True. Most are family businesses, not VC-backed."},
{r:1,k:"mc",t:"Rates and the risk curve",
 q:"When the risk-free rate goes to zero, where do pensions and endowments move?",
 o:["Out the risk curve into alternatives such as VC","Into government bonds","Into cash","Into money-market funds"],a:0,
 ex:"QE and a zero risk-free rate pushed investors from government debt to senior debt, equity, then VC and crypto. It reverses when rates normalize; in 2026 the 10-year is about 5%.",
 w:[null,"Bonds yield almost nothing at zero rates, and pensions have return targets to hit.","Cash earns zero; they need return.","Same problem as cash."]},
{r:1,k:"mc",t:"Why hedge funds went into VC",
 q:"Why did hedge funds move into VC?",
 o:["All of these","Minimal mark-to-market","A hidden, asymmetric edge with no need to beat the S&P or Nasdaq","Long-term locked capital instead of 1-month to 1-year redemptions"],a:0,fixed:1,
 ex:"All three: no daily red/green stress, a hidden edge with no public benchmark, and 10 years of locked capital."},
{r:1,k:"mc",t:"The see-saw",
 q:"On the see-saw slide, what stays constant and what swings?",
 o:["Innovation is constant; capital deployment swings with risk appetite","Capital is constant; innovation swings","Both swing together","Valuations are constant; deal counts swing"],a:0,
 ex:"Risk-averse periods (2001–02, 2008–09) give capital owners the strongest negotiating position, even though ideas keep coming."},
{r:1,k:"calc",t:"Flow of funds",
 c:"$100 is committed and split into 10 ventures of $10 each (ignore the fee). Five go to $0 and five reach $30 each.",
 q:"How much is harvested?",
 o:["$150","$100","$300","$50"],a:0,
 ex:"5 × $30 = $150. It's distributed as (1) a return of capital, then (2) a return on capital, shared with the GP through carry.",
 w:[null,"That's only the capital committed.","That assumes all ten reach $30. Five went to zero.","That's the profit ($150 − $100), not the amount harvested."]},
{r:1,k:"tf",t:"Permanent capital",o:TF,a:1,
 q:"True or false: a VC fund is permanent capital, like equity in a listed company.",
 ex:"A fund has a 10-year life plus up to 2 years of extension: an 'incomplete circle'. A listed share is a perpetuity, a 'complete circle'. That maturity mismatch is why Blackstone, KKR and Carlyle listed.",
 m:"VC is not permanent capital: the fund must invest, grow and exit within its term."},
{r:1,k:"mc",t:"Phases of growth",
 q:"Which investor fits the rapid-growth phase (3–10 years, ending in stable growth)?",
 o:["Hedge funds","VC","Angels","Buyouts only"],a:0,
 ex:"Venture phase (0–7 years, ending in IPO or acquisition) is VC; rapid growth is hedge funds; stable growth is buyouts and hedge funds. This course covers 0 → T; corporate finance covers T+."},
{r:1,k:"tf",t:"Myth: young dropouts",o:TF,a:1,
 q:"True or false: most tech founders are young dropouts.",
 ex:"Kauffman: the average tech-startup founder is 39, and founders over 50 outnumber those under 25 two to one."},
{r:1,k:"mc",t:"Myth: driven by VC",
 q:"Where does about 80% of start-up funding come from?",
 o:["Family, friends, fools and angels","VC firms","Corporate VC","Banks"],a:0,
 ex:"VC matters mostly in capital-intensive sectors such as tech and biotech."},
{r:1,k:"mc",t:"Idea vs opportunity",
 q:"Nook → Peloton, Fire Phone → Alexa, Newton → iPad, Digicash → Bitcoin. What do these pairs show?",
 o:["The idea was right but the timing was not","Big companies can't innovate","First movers always win","Hardware always fails"],a:0,
 ex:"Opportunity doesn't equal certain success. Opportunity = probability of success relative to the risk-return outlay over time."},
{r:1,k:"mc",t:"What you can control",
 q:"Due diligence, negotiation, valuation, timing and luck turn an idea into an opportunity. Which are NOT controllable?",
 o:["Timing and luck","Due diligence and negotiation","Valuation and negotiation","All five are controllable"],a:0,
 ex:"Only the first three are controllable."},
{r:1,k:"mc",t:"The investment memo",
 q:"What are the four components of the professor's firm's memo template?",
 o:["Market, People, Context, Deal","Management, Moats, Forecastability, Price","Scalable, Sustainable, Sentiment, Size","TAM, SAM, SOM, CAC"],a:0,
 ex:"Each is written up and ranked A/B/C, because no one knows which matters most. There is no one right way to write a memo; each firm differs (see bvp.com/memos).",
 w:[null,"That's the alternative framework he mentions, not his firm's template.","Those are his three S's, not the memo.","Those are market-sizing and unit-economics terms."]},
{r:1,k:"mc",t:"The three S's",
 q:"What are the professor's three S's for testing an opportunity?",
 o:["Scalable, Sustainable, Sentiment","Speed, Size, Strategy","Simple, Scalable, Secure","Seed, Series, Sale"],a:0,
 ex:"In Invisible Wires: scalable (the licenses), sustainable (a moat and a team that lowers key-man risk) and sentiment (hype, other VCs)."},
{r:1,k:"cmt",t:"Invest in the entity",
 c:"A classmate says: \"Would you invest in someone like Steve Jobs? Of course. Would you want to work for him? No. So investing in him would be a mistake.\"",
 q:"What is the flaw?",
 o:["You invest in the entity, not the person; working for someone is a different question","There's no flaw: never invest in a founder you wouldn't work for","VCs don't care about founders at all","Charisma is always a negative signal"],a:0,
 ex:"\"Invest in people, not ideas\" (Arthur Rock), but the investment is in the company. Charisma can be positive (selling, creating an aura) or negative (vision without execution).",
 w:[null,"That mixes up the employee's question with the investor's.","At seed you have only people; founders matter a lot.","Charisma cuts both ways."]},
{r:1,k:"fig",t:"The funnel",fig:"funnel",
 q:"What share of the pitches a VC firm receives reaches due diligence?",
 o:["About 1%","About 10%","About 25%","About 5%"],a:0,
 ex:"There's an order-of-magnitude difference by mindset. Y Combinator funds under 2%; Kleiner Perkins' iFund got 6,000 requests and funded 14. Many darts are still thrown, which is why winners pay for losers.",
 w:[null,"About 10% reach the business-plan stage at a VC firm.","About 25% get a meeting.","About 5% is the angel figure."]},
{r:1,k:"mc",t:"Gartner hype cycle",
 q:"What is the order of the Gartner hype cycle?",
 o:["Trigger → peak of inflated expectations → trough of disillusionment → slope → plateau","Trigger → trough → peak → plateau → slope","Peak → trigger → slope → trough → plateau","Plateau → trigger → peak → trough → slope"],a:0,fixed:1,
 ex:"It's part of 'context' in the opportunity framework. Example: even Amazon was in the 'all internet' trough in 2002."},
{r:1,k:"mc",t:"Biggest liquidity event",
 q:"Why does the professor call 2025–27 'the biggest liquidity event in history'?",
 o:["OpenAI, Anthropic and SpaceX together are worth more than all VC invested in US companies since 2010","More start-ups are being liquidated than ever","Interest rates fell to zero again","Secondary markets were banned"],a:0,
 ex:"OpenAI ~$852B, Anthropic ~$965B, SpaceX IPO ~$1.7T: $3.5T+ combined, versus $2.7T of total US VC investment since 2010 and $1.4T for all US tech IPOs since 2010."},
{r:1,k:"tf",t:"VC during the pandemic",o:TF,a:1,
 q:"True or false: VC activity slowed sharply after Q1 2020.",
 ex:"It didn't. Quarterly VC IRRs and cash flows spiked, and the correction lasted under four weeks."},
{r:1,k:"fig",t:"After the 2021 peak",fig:"deals",
 q:"What happened to deal activity after 2021?",
 o:["Deal counts fell sharply and the share of seed deals rose","Deal counts kept rising with AI","Deal counts fell but seed disappeared entirely","Nothing changed"],a:0,
 ex:"From about 1,031 deals at top firms in 2021 to about 244 by 2023 YTD."},
{r:1,k:"fig",t:"Power law across VCs",fig:"vcpower",
 q:"What does this chart imply?",
 o:["The power law applies to VC firms, not just start-ups","Most VC investors make at least one successful investment","Returns are spread evenly across VC firms","Big funds always outperform"],a:0,
 ex:"The top 5% of investors take about 90% of returns. That's why manager selection matters so much in VC.",
 w:[null,"About 62% of investors in the sample had no successful investment.","The opposite: returns are extremely concentrated.","The chart is about concentration, not fund size. Kauffman found no fund over $500M returned more than 2x net."]},
{r:1,k:"mc",t:"The fatal VC mistake",
 q:"According to a16z (Sept 2026), what is the fatal mistake in VC?",
 o:["Picking the right category but the wrong company, or passing on a SpaceX, OpenAI or Stripe","Investing in too many companies that fail","Paying too high a price","Taking too long on due diligence"],a:0,
 ex:"Losses are only about 15 cents per dollar invested; Databricks alone is 20% of a16z's AUM. \"If you pass and it succeeds, you never stop hearing about it.\" The professor backed 4 of 17 search engines and missed Google.",
 w:[null,"Failures are expected and capped at the amount invested. Missing the winner is what hurts.","With power-law returns, overpaying for the winner matters far less than missing it.","Speed matters in hot markets, but it isn't the fatal mistake."]},
{r:1,k:"case",t:"Skype",
 c:"Skype was turned down by 20 VCs, sold to eBay for $2.6B (2005), written down by $1.4B, sold to PE for about $2.0B (2009), then to Microsoft for about $8.0B (2011).",
 q:"What is the lesson?",
 o:["Context and timing drive value","VCs are usually right to pass","Strategic buyers always overpay","Telecom is a bad sector"],a:0,
 ex:"The same asset was worth very different amounts to different buyers at different times."},
{r:1,k:"case",t:"Lego 1: get on the plane?",
 c:"Jan 2003. Bob, a real-estate tycoon, calls about a 'hot deal' in LA wireless broadband that needs $150M. Your fund is $50M.",
 q:"Do you get on the plane?",
 o:["Yes: it's a great contact, and there's no commitment yet","No: the deal is three times the fund","No: you can't trust Bob","Only after Bob sends a business plan"],a:0,
 ex:"Due diligence is dating; investing is marriage. About 90% of each class says yes. Still check whether the $150M can be staged.",
 w:[null,"The most common 'no'. But meeting costs nothing, and the amount may be staged; it turned out to be $15M per county.","Bob is conflicted, so use him for access, not information. That's a reason to go and check.","You'd lose the deal to the VCs already on their way. There's no paper anyway; Mr M pitches verbally."]},
{r:1,k:"mc",t:"Nobody got on the plane",trap:1,
 q:"In which year did no class get on the plane?",
 o:["2009","2008","2002","2020"],a:0,
 ex:"Not 2008: humans process shocks with about a six-month lag. Everyone got on in 2014 (social-media IPO hype) and 2021 (QE and COVID bubble)."},
{r:1,k:"mc",t:"The logical reason not to go",
 q:"What would be a logical reason not to get on the plane, and why doesn't it apply here?",
 o:["Lacking sector expertise, but you are the telecom expert","The deal is too big, but Bob will cover it","It's in LA, but you have a flight","Bob is conflicted, but he's a friend"],a:0,
 ex:"The case is a trick: you are the NY media-tech and telecom expert, and your partner in LA knows the local network."},
{r:1,k:"mc",t:"Using Bob",
 q:"How should you treat Bob?",
 o:["Use him for access, not information","Trust his numbers; he sold Mr M's house","Ignore him; angels are amateurs","Bring him onto your investment committee"],a:0,
 ex:"He has seed money in and isn't an expert, so he's conflicted. Ask anyone pitching: \"Are you in this position?\" That's rational skepticism."},
{r:1,k:"mc",t:"Jan 2003 context",
 q:"In January 2003, who held negotiating leverage?",
 o:["The VCs: post dot-com, capital was scarce","The founders: capital was plentiful","Nobody; markets were closed","The FCC"],a:0,
 ex:"In 2026 AI it's the opposite: take the founder's terms or write a smaller check."},
{r:1,k:"mc",t:"A 'tiny fraction' of the market",
 q:"Mr M only needs a 'tiny fraction' of the broadband market. What should you ask, and why does it matter?",
 o:["What is the fraction and the data source? A small slice is enough for convexity and leaves room for competitors","Nothing; small targets are always safe","Whether he can capture half the market instead","Whether the FCC will auction more spectrum"],a:0,
 ex:"Probe the assumption. You only need small penetration to get convexity."},
{r:1,k:"mc",t:"Assignment 1: gross vs net",
 q:"The portfolio grows at 25% a year, but LPs earn an IRR of about 19%. What explains the gap?",
 o:["Management fees plus carried interest","Taxes","Inflation","The GP's discount rate of 20%"],a:0,
 ex:"Gross versus net return. Fees are charged on committed capital every year regardless of performance; carry takes 20% of profits once LPs get their $500M back.",
 w:[null,"Taxes aren't in the model.","The model is nominal.","The 20% rate is used to value the GP's cash flows, not the LPs' return."]},
{r:1,k:"calc",t:"Assignment 1: day-0 investment",
 c:"$500M committed; 25% drawn in year 0. The management fee is 2.5% of committed capital, paid in advance.",
 q:"How much is actually invested at day 0?",
 o:["$112.5M","$125M","$121.9M","$100M"],a:0,
 ex:"25% × $500M = $125M drawn, less the $12.5M fee (2.5% × $500M committed) = $112.5M.",
 w:[null,"That ignores the management fee.","That charges the fee on drawn capital ($125M). Fees are on committed capital.","That deducts a 5% fee. The fee is 2.5% of committed: $12.5M."]},
{r:1,k:"mc",t:"Fees over a fund's life",
 q:"Over 10 years, roughly how much of committed capital do fees consume?",
 o:["About 20–25%","About 2%","About 50%","Nothing; fees come out of profits"],a:0,
 ex:"\"2 and 20\" means $100 becomes about $80 before any return.",
 w:[null,"2% is one year's fee. It's charged every year.","Too high for a standard fund.","Management fees are charged on committed capital regardless of performance."]},
{r:1,k:"tf",t:"When carry starts",o:TF,a:1,
 q:"True or false: the GP earns 20% carry on committed capital from year 1.",
 ex:"Carry is on profits, not committed capital, and starts only after LPs get their capital back. In Assignment 1 it starts in year 7. Many GPs also put in 1–5% of the fund as skin in the game."},
{r:1,k:"mc",t:"Why funds keep getting bigger",
 q:"Why do a16z and Sequoia keep raising ever-larger funds?",
 o:["Management fees don't depend on performance, so a bigger fund earns more fees","Bigger funds always earn higher returns","LPs require it","Regulation caps the number of deals per fund"],a:0,
 ex:"Fees scale with size. In Assignment 1 the GP's NPV (~$108M) comes from ~$12.5M of fees every year plus carry.",
 w:[null,"Kauffman found no fund over $500M returned more than 2x net.","LPs don't require bigger funds.","There's no such cap."]},

/* ───────── Class 2 ───────── */
{r:2,k:"mc",t:"Why outside funding is hard",
 q:"Every VC deal is a negotiation over what?",
 o:["Wealth creation versus wealth transfer","Control versus independence","Debt versus equity","Growth versus profitability"],a:0,
 ex:"Founders believe they alone create wealth; VCs supply capital and expertise. At first meetings the valuation gap can be hundreds of percent."},
{r:2,k:"case",t:"Founder mindset",
 c:"A founder says: \"My baby, my idea, my decisions.\" To you, their projections look delusional.",
 q:"What best explains the gap?",
 o:["They have 100% concentration risk; you risk about 5% of a fund","Founders are always irrational","They are hiding information on purpose","They don't understand finance"],a:0,
 ex:"What looks like delusion to you is their reality. Founders who 'fake it till they make it' believe it; it isn't fake to them."},
{r:2,k:"mc",t:"The hardest party",
 q:"Which party is often the hardest to deal with in a VC deal?",
 o:["The partners inside your own firm","The founder","The LPs","Other VCs"],a:0,
 ex:"The fund is a fixed pool: your $5M is $5M less for other partners, and the lead partner gets extra points of carry, so jealousy follows. He takes each partner to lunch before the investment committee."},
{r:2,k:"tf",t:"Insider information",o:TF,a:0,
 q:"True or false: VCs legally trade on insider information.",
 ex:"True. Private markets and accredited investors. That's why you reveal nothing in lobbies, lifts, trains or planes; he lost a deal when an associate discussed pricing next to a competitor."},
{r:2,k:"tf",t:"Track record",o:TF,a:1,
 q:"True or false: a strong track record guarantees the founder's next venture will succeed.",
 ex:"A track record is like a historic share-price chart: an indication, not a guarantee. \"Never get married to the investment thesis.\""},
{r:2,k:"mc",t:"Serial entrepreneurs",
 q:"Serial entrepreneurs raise faster, with less dilution and higher valuations. When does that advantage mostly disappear?",
 o:["When they move to a different sector","When they are over 40","When they raise from new VCs","When their last exit was an acquisition"],a:0,
 ex:"The key test is serial in the same sector (the King's Quest and Zelda story). Elon Musk is the exception, because all his ventures are 'hard engineering'."},
{r:2,k:"case",t:"Founders who failed",
 c:"A founder's last company failed spectacularly. Their new idea looks strong.",
 q:"Would you back them?",
 o:["Yes, if the new idea is good: ask why they failed and whether the new idea repeats it","No, a failure is a permanent red flag","Only with a full ratchet","Only if they put in more of their own money"],a:0,
 ex:"Nook → Peloton: the same Barnes & Noble team bundled hardware and content twice. Without Nook, probably no Peloton. The question is forward risk."},
{r:2,k:"mc",t:"Founder traits",trap:1,
 q:"Most important founder trait: charisma, technical skill or grit?",
 o:["Grit is a minimum condition, not a differentiator","Grit, clearly","Charisma","Technical skill"],a:0,
 ex:"The class mostly says grit (since Duckworth and COVID). He treats it as table stakes and prefers repeat founders in the same sector."},
{r:2,k:"mc",t:"Four forward-looking components",
 q:"Which is NOT one of the four forward-looking components?",
 o:["Founder's age","Uncertainty","Asymmetric information","Nature of assets"],a:0,
 ex:"The four are uncertainty, asymmetric information, nature of assets and market conditions."},
{r:2,k:"fig",t:"Moving left on the spectrum",
 fig:{type:"table",title:"Where each company sits",head:["Component","Window maker (50 yrs)","Hard-disk maker","Invisible Wires"],rows:[["Uncertainty","Low","Medium","High"],["Asymmetric information","Low","Medium","High"],["Nature of assets","Tangible","Mixed","Intangible"],["Market conditions","Less important","Important","Important"]]},
 q:"What is your job in due diligence relative to this table?",
 o:["Move the start-up a little to the left on each row","Move it to the right to justify a higher valuation","Prove it belongs in the window-maker column","Ignore the table; only the market matters"],a:0,
 ex:"You can't guarantee anything, but small findings help. Spectrum is both a moat and residual value. The 'Hail Mary' can be in the outcome, never in the investment process.",
 w:[null,"Right means more risk.","A start-up will never look like a 50-year-old manufacturer.","Market conditions are only one of four components."]},
{r:2,k:"mc",t:"Black Swan",
 q:"Which is a Black Swan: Google, the pandemic, both or neither?",
 o:["Both","Google","The pandemic","Neither"],a:0,fixed:1,
 ex:"Taleb: unpredictable, massive impact, explained after the fact as if it were predictable. It can be the left tail (GFC, COVID) or the right tail (Google). VC wants maximum exposure to positive Black Swans."},
{r:2,k:"mc",t:"Hockey sticks",
 q:"About half of pitches show a hockey-stick revenue chart with no probability adjustment. How does the professor react?",
 o:["It makes him less likely to invest","It's expected; he ignores it","It's a sign of a strong founder","He asks them to remove it"],a:0,
 ex:"A single venture's cash flows end up better than projected, as projected, or 'crash and burn', and most crash."},
{r:2,k:"case",t:"Hotmail",
 c:"VCs funded a database company built to compete with Oracle. The engineers' internal email tool became Hotmail. Founder Sabeer Bhatia: \"We thought we could raise enough money on our original database plan that we wouldn't have to tell anyone about the email idea.\"",
 q:"What is the fix VCs now use?",
 o:["Ring-fencing: the term sheet covers the company and any and all associated products developed during the investment period","Board control","A full-ratchet anti-dilution clause","Monthly audited reports"],a:0,
 ex:"The documents covered only the database, so the VCs couldn't easily claim the email product. Slack was a pivot out of a computer game, and the professor's firm captured it because of the ring-fence.",
 w:[null,"Control is rarely the answer in VC, and it wouldn't have given legal rights to the product.","Anti-dilution protects value in a down round. It has nothing to do with a hidden product.","Information rights help, but the problem was legal scope."]},
{r:2,k:"case",t:"Agency problems",
 c:"A VC refuses to join a company's future rounds to squeeze the founders on price.",
 q:"Which agency problem is this, and what is the fix?",
 o:["Hold-up; fixed by covenants","Adverse selection; fixed by screening","Moral hazard; fixed by sharing in outcomes","Black Swan; fixed by scenarios"],a:0,
 ex:"Adverse selection (lemons, lying) is fixed by screening and due diligence; moral hazard (cheating) by sharing in outcomes; hold-up (opportunism) by covenants. In VC there is asymmetric information 100% of the time.",
 w:[null,"Adverse selection is the founder hiding bad quality before the deal.","Moral hazard is cheating after the deal.","A Black Swan is an extreme event, not an agency problem."]},
{r:2,k:"mc",t:"Intangible assets",
 q:"What was Spirit Airlines' most valuable asset?",
 o:["Its customer data","Its planes","Its landing slots","Its brand"],a:0,
 ex:"It was bought for ad targeting. Most of the S&P 500's value is now intangible, and Nortel's patents were worth over $10B after the company collapsed. Intangibles are hard to value and secure but increasingly the most valuable."},
{r:2,k:"mc",t:"VC as an asset class",
 q:"Under Modern Portfolio Theory, what justifies an allocation to VC?",
 o:["Low correlation with the market benchmark","Daily liquidity","Lower volatility than bonds","Guaranteed top-quartile returns"],a:0,
 ex:"Cambridge Associates: 1980–99 VC returned 23.5% against the S&P's 18.2%, with Sharpe ratios of 1.77 versus 0.73."},
{r:2,k:"case",t:"Cold vs hot markets",
 c:"Capital is scarce and markets are falling.",
 q:"How do VCs typically behave?",
 o:["Keep founders waiting, short leashes, tough terms, low valuations","Club together and chase deals","Pay up to win allocation","Let founders set the terms"],a:0,
 ex:"In a hot market VCs 'club' and founders think 'build it and they will come'. Fund-raising peaks at market peaks: about $500B raised in the five years to 2000."},
{r:2,k:"fig",t:"Manager selection",fig:"disp",
 q:"Why is the spread so much wider in VC than in bonds?",
 o:["Knowledge arbitrage, asymmetric information and illiquidity","VC managers charge higher fees","Bond managers are better trained","VC funds are smaller"],a:0,
 ex:"In public large-cap there's no knowledge edge, so the spread is narrow. In the updated chart, bottom-quartile VC and hedge funds are negative. As VC grows, the big get bigger: Sequoia and a16z win through reputation, capital and first look.",
 m:"In alternatives, manager selection is vital because the spread is so wide. In public equity, picking the right manager gets you a point or two."},
{r:2,k:"mc",t:"J-curve",
 q:"Why are textbook J-curve returns negative early in a fund's life?",
 o:["Fee drag plus early 'lemons' failing first","Winners are sold first","Interest rates are high early on","LPs withdraw capital early"],a:0,
 ex:"Then returns turn positive in the second half as exits come. LPs are told to wait. Across several funds, J-curves blend into a portfolio curve."},
{r:2,k:"fig",t:"N-curve",fig:"jn",trap:1,
 q:"Which line matches what the Kauffman Foundation (2012) found, and why?",
 o:["Line 2: reported returns peak around month 16, when GPs start raising their next fund","Line 1: the textbook J-curve holds","Line 2: early investments are the best ones","Line 1: fees fall over time"],a:0,
 ex:"At month 16 nothing is realized; the marks are set by the GPs themselves. The median time to the first capital call of the next fund is 26.6 months. The fund dies in year 10, so GPs need good early numbers.",
 w:[null,"Line 1 is the textbook J-curve that Kauffman rejected.","The early peak reflects GP marks, not realized returns.","Line 1 is the J-curve; fees don't explain Kauffman's finding."]},
{r:2,k:"tf",t:"Kauffman: VC vs public markets",o:TF,a:1,
 q:"True or false: Kauffman found that VC beats public markets by 3–5% a year.",
 ex:"It doesn't. Kauffman also found the average VC fund barely returns capital after fees, and in 8 of 12 vintage years from 1997–2009 the median fund had a negative IRR. The professor refused to argue against Kauffman: \"It's right; I run a fund that does this.\""},
{r:2,k:"mc",t:"Kauffman's findings",
 q:"Which is one of Kauffman's findings?",
 o:["No fund over $500M returned more than 2x net","The average VC fund returns 3x after fees","Fund lives rarely exceed 10 years","Top-quartile and vintage-year reporting is reliable"],a:0,
 ex:"The five findings: misleading top-quartile and vintage reporting; the average fund barely returns capital after fees; VC doesn't beat public markets by 3–5%; fund lives often run 12–15 years; no fund over $500M returned more than 2x net.",
 w:[null,"The average fund barely returns capital after fees.","Fund lives often run 12–15 years.","Kauffman called that reporting misleading."]},
{r:2,k:"mc",t:"Kauffman's recommendations",
 q:"Which is one of Kauffman's recommendations to LPs?",
 o:["Benchmark VC against a public market equivalent such as the Russell 2000","Keep a fixed VC allocation","Pay GPs more management fees","Trust the J-curve"],a:0,
 ex:"The five: abolish VC mandates; reject the J-curve assumption; open the black box of GP economics; pay for performance (2-and-20 rewards size); benchmark against a public market equivalent."},
{r:2,k:"mc",t:"AI and the J-curve",
 q:"Is the J-curve still relevant with AI-era VC?",
 o:["AI makes J-curve expectations worse","AI has fixed the J-curve","AI made it irrelevant because returns are realized faster","It's unchanged"],a:0,
 ex:"Investors now expect markups within six months: higher round prices, higher reported IRR, more capital, bigger funds, higher prices again, with no realized-return check. \"A power law cannot be obvious\", yet everything is priced as an outlier. The bumper sticker: \"Please God, just one more bubble.\""},
{r:2,k:"mc",t:"Fund economics",
 q:"Which set of terms is typical for a VC fund?",
 o:["2.0–2.5% fee, 20% carry, 8–10% hurdle","1% fee, 10% carry, no hurdle","2% fee, 50% carry, 20% hurdle","No fee, 30% carry"],a:0,
 ex:"Capital is drawn through capital calls. LPs are qualified investors: pensions, endowments and wealthy individuals."},
{r:2,k:"mc",t:"Lego 2: $150M becomes $15M",
 q:"Bob said $150M; Mr M asked for $15M per county of 100,000 homes, staged. Why does that matter so much?",
 o:["A donut now costs $15M, not the whole $50M fund: it's survival risk","It lowers the valuation","It means Mr M is less ambitious","It removes the need for due diligence"],a:0,
 ex:"Bob's information was wrong because he isn't the founder. Staging changes the size of the possible loss."},
{r:2,k:"mc",t:"The spectrum licenses",
 q:"Why are Mr M's two spectrum licenses so important?",
 o:["They're a scalable constraint, a moat and downside protection","They guarantee customers","They let Mr M skip regulation entirely","They can be pledged to the FCC for cash"],a:0,
 ex:"No growth without licenses, but only he holds them: held for 20 years, not auctioned, no others in the area. If the business fails you can resell the spectrum, so it isn't a donut."},
{r:2,k:"tf",t:"Signing the NDA",o:TF,a:0,
 q:"True or false: you should sign a generic NDA before the pitch.",
 ex:"True. Most NDAs have little teeth in court. Don't let it block access."},
{r:2,k:"mc",t:"A pitch with no paper",
 q:"Mr M pitches verbally, with no paper. Good, bad or indifferent?",
 o:["Normal for a serial founder: paper anchors you to numbers","A red flag: he's hiding something","Irrelevant","Bad: first-timers do better"],a:0,
 ex:"First-timers almost always bring paper as a defense."},
{r:2,k:"mc",t:"Go in pairs",
 q:"Why does the professor always go to pitch meetings in pairs?",
 o:["One asks questions and takes notes; the other watches how defensive the answers are","To split the travel cost","Because one must be a lawyer","To outnumber the founder"],a:0,
 ex:"Reading the founder matters as much as the content."},
{r:2,k:"case",t:"The lobby",
 c:"You arrive at Mr M's office at 3pm and wait in the lobby.",
 q:"What should you do?",
 o:["Read the sign-in book, chat to the receptionist and watch who walks past","Read a magazine and relax","Review your notes out loud with your partner","Phone your office about pricing"],a:0,
 ex:"The sign-in book shows competing VCs; back-to-back meetings confirm the deal is hot, and charisma that survives a full day signals stamina. His boss still sends him a magazine subscription every Christmas, 22 years later, for reading one in a lobby.",
 w:[null,"That's the mistake his boss never let him forget.","Never talk where others can hear.","He lost a deal when an associate discussed pricing next to a competitor."]},
{r:2,k:"mc",t:"Moto in the room",
 q:"You see Moto employees leaving Mr M's room. What does it signal?",
 o:["A possible exit, but is Mr M already negotiating a sale or IP deal?","Nothing; it's a routine supplier visit","The deal is dead","Moto will lead the round"],a:0,
 ex:"A corporate may want the technology, not a financial return."},
{r:2,k:"mc",t:"'Vultures'",
 q:"Mr M 'hates bureaucracy and vultures'. How did the professor open meetings like this?",
 o:["With his 8 patents, not his VC title, showing curiosity and humility","With his fund's track record","With a term sheet","With a list of competing deals"],a:0,
 ex:"VCs and bankers are disliked on the West Coast."},
{r:2,k:"mc",t:"Judgment vs numbers",
 q:"Is VC about judgment or numbers?",
 o:["Judgment","Numbers","Equal parts","Neither; it's about luck"],a:0,
 ex:"There's no data at seed, and AI can't replace judgment (gut feel). Psychology, trust, jealousy and FOMO matter as much as numbers."},
{r:2,k:"mc",t:"The most important VC skill",
 q:"Most important VC skill: capital, expertise, or connections and reputation?",
 o:["Connections and reputation","Capital","Expertise","All equal"],a:0,
 ex:"Capital is the least important; expertise matters only through access. Matt Levine: the essential skill is getting access to the right deals, not picking them."},
{r:2,k:"tf",t:"Can an LLM pick winners?",o:TF,a:1,
 q:"True or false: ChatGPT or another LLM can predict which start-ups will succeed.",
 ex:"LLMs are trained on normal distributions and can't predict power-law outliers. This was the student answer he praised in class 2."},
{r:2,k:"tf",t:"Rating VCs",o:TF,a:1,
 q:"True or false: there is a central database that tells you which VCs are good.",
 ex:"One existed but was pulled by VCs. Today there are only review sites, including reviews of individual VC partners."},
{r:2,k:"tf",t:"Government's role",o:TF,a:0,
 q:"True or false: the government's role in VC has increased.",
 ex:"Spectrum, TikTok, AI exports, gig-worker rules. Regulators are both a barrier to entry and a risk."},
{r:2,k:"tf",t:"Threats to VC",o:TF,a:0,
 q:"True or false: VC as an industry has been threatened since the GFC.",
 ex:"By hedge funds, mutual funds, corporate VC, crowdfunding, ICOs (after the JOBS Act 2012), SPACs and direct listings."},
{r:2,k:"mc",t:"2022 and VC",
 q:"How important were 2022 public-market returns to VC?",
 o:["Briefly important, then forgotten","Decisive for years","Irrelevant","They caused a permanent shift away from AI"],a:0,
 ex:"It was the first correction since 2009. Markdowns lagged by 3–6 months, due diligence mattered again for about six months, and the losses were tiny relative to gains since QE1."},

/* ───────── Class 3 ───────── */
{r:3,k:"mc",t:"A single number?",
 q:"In a start-up valuation, is there a single number? A right answer?",
 o:["A single number yes; a right answer no","Both yes","Both no","A right answer yes; a single number no"],a:0,fixed:1,
 ex:"There is the agreed number at that point in time, which comes from a 'range of reasonableness' and negotiating power. Whether it was right is known only later."},
{r:3,k:"mc",t:"Mark-to-model",
 q:"Why can the same start-up carry different marks at different VCs at the same time?",
 o:["Each VC uses its own model; it's mark-to-model, not mark-to-market","One of them is breaking the law","Marks follow the stock market","Marks depend on fund size"],a:0,
 ex:"LPs can't spend unrealized marks, only realized cash. Sequoia tells LPs to ignore unrealized gains."},
{r:3,k:"mc",t:"Create the box",
 q:"'Create the box, then think outside it.' What does the VC add to the entrepreneur's drivers?",
 o:["Other markets and products, fixed vs variable costs, financing stages and milestones, its own risk tolerance","The founder's salary","A higher growth rate","Public-company comps for today"],a:0,
 ex:"Together they form a 3-D box that shows the key sensitivities and break-even points, with exits on top."},
{r:3,k:"mc",t:"When valuation is done",
 q:"When is valuation done: up front, continuously, or at exit?",
 o:["Continuously","Up front","At exit","Only when a new round is raised"],a:0,
 ex:"Up front (invest, at what price), during (fund more or liquidate, protect against dilution) and at exit (trade sale or IPO, how much to keep). It's iterative across the VC cycle."},
{r:3,k:"case",t:"DoubleClick",
 c:"VC entered at about $1.50/share (1996), IPO at $4.25 (1998), high of $135.25 (Jan 2000), low of $4.50 (2004). Hellman & Friedman took it private at about $8.50 (2005) and sold it to Google at about $24 (2007).",
 q:"What does the case show?",
 o:["Each investor type has a different time horizon, and more data doesn't automatically mean a higher valuation","Public markets always value companies correctly","VCs should hold after the IPO","PE always beats VC"],a:0,
 ex:"VCs exited fully in the bubble with an IRR above 1,000%. Public long-term holders lost. VC and PE both earned IRRs above 75%."},
{r:3,k:"fig",t:"How VCs value",fig:"methods",trap:1,
 q:"Which method is actually used for early-stage VC?",
 o:["Gut feel","DCF","Real options","Simulation"],a:0,
 ex:"\"We pretend.\" Market analysis and multiples are used more widely across stages, but at early stage the honest answer is gut feel.",
 w:[null,"DCF needs history and stable cash flows; it fits year 5+.","Only 10% use options; he never does.","Only 22% use simulation."]},
{r:3,k:"mc",t:"The VC method",
 q:"Which formal valuation method is most common in years 0–2?",
 o:["The venture capital method","DCF","Comparable multiples","Real options"],a:0,
 ex:"Price = terminal value × investor % ÷ (1+r)^n. It ignores negative early cash flows and uses one exit value and one high rate. All three main methods need an exit timeframe, a discount rate and a terminal value.",
 w:[null,"DCF is for year 5+ once there's history.","Comps are used near exit.","Real options are for biotech and natural resources."]},
{r:3,k:"mc",t:"DCF's weakness",
 q:"What is the main weakness of DCF for a start-up?",
 o:["Too many variables, the terminal value dominates, and the cost of capital is hard to pin down","It gives only relative value","It ignores the time value of money","It can't handle positive cash flows"],a:0,
 ex:"It's 'theoretically pure' and gives an absolute value, but it fits only once there's history, around year 5+."},
{r:3,k:"mc",t:"Comps' weakness",
 q:"What is wrong with comparable multiples for a young start-up?",
 o:["They assume exit now, ignore intangibles and can produce negative multiples","They're too slow to calculate","They require a discount rate","They overvalue tangible assets"],a:0,
 ex:"'Quick and easy' relative value. Most useful near exit."},
{r:3,k:"mc",t:"Real options",
 q:"Where are real options actually used?",
 o:["Biotech (FDA pathways) and natural resources (drilling)","Consumer apps","SaaS","Every seed deal"],a:0,
 ex:"Volatility and outcomes are hard to estimate, and the professor never uses it. Staging itself is a 'wait-and-see' option, but uncertainty must fall over time or later decisions are no better than current ones."},
{r:3,k:"mc",t:"Modelling similarity",trap:1,
 q:"What is the biggest similarity between early-stage VC modelling and hedge fund, buyout or growth modelling: convexity, project length or stability of variables?",
 o:["None of the above","Convexity","Project length","Stability of variables"],a:0,fixed:1,
 ex:"It's a new order of difficulty: no convexity parity, no stable variables, a different horizon."},
{r:3,k:"mc",t:"David Beer's rule of thumb",
 q:"According to David Beer's rule of thumb, what is a venture worth once it has sold to real customers?",
 o:["About $750K","About $15K","About $150K","About $7.5M"],a:0,
 ex:"Just an idea: about $15K. With a credible team: about $150K. Sold to real customers: about $750K."},
{r:3,k:"calc",t:"Pre and post money",
 c:"You invest $10 for 10% of the company.",
 q:"What are the post-money and pre-money valuations?",
 o:["Post $100, pre $90","Post $90, pre $100","Post $110, pre $100","Post $100, pre $110"],a:0,
 ex:"Post-money = investment ÷ % ownership = $10 ÷ 10% = $100. Pre-money = post − investment = $90. The only certain number is your $10 (and zero).",
 w:[null,"Reversed: post-money includes the new money, so it's the larger number.","That adds the investment to a pre-money of $100, but the 10% defines the post-money.","Pre-money is post minus the investment, not plus."]},
{r:3,k:"calc",t:"Assignment 2a: ownership",
 c:"Invest $10M. Profits reach $20M in 5 years; exit P/E is 20; required return is 50%.",
 q:"What minimum ownership do you need?",
 o:["About 19%","About 3.75%","About 7.6%","About 2.5%"],a:0,
 ex:"Terminal value = $20M × 20 = $400M. Required future value = $10M × 1.5^5 = $75.9M. Ownership = 75.9 ÷ 400 ≈ 19%.",
 w:[null,"That uses a simple return ($10M × 1.5 = $15M). The money is locked in for 5 years, so compound: 1.5^5.","That uses the 25% growth rate as the discount rate. A single deal needs more because winners pay for losers.","That's $10M ÷ $400M with no required return at all."],
 m:"Ownership = Investment × (1+r)^n ÷ Terminal value."},
{r:3,k:"calc",t:"Assignment 2a: pre-money",
 c:"Same deal: terminal value $400M, 5 years, 50% required return, $10M invested.",
 q:"What is the pre-money valuation?",
 o:["About $42.7M","About $52.7M","$390M","About $62.7M"],a:0,
 ex:"PV of exit = 400 ÷ 1.5^5 = $52.7M = post-money. Pre-money = 52.7 − 10 = $42.7M.",
 w:[null,"That's the post-money.","That subtracts $10M from the undiscounted exit value.","That adds the investment instead of subtracting it."]},
{r:3,k:"mc",t:"Double counting risk",
 q:"What is 'double counting risk' in the VC method?",
 o:["Using a very high discount rate and also demanding extra ownership for the same risk","Counting the same investor twice on the cap table","Using two valuation methods","Applying a liquidation preference twice"],a:0,
 ex:"A common mistake from the suggested solution. Also state the implicit assumptions: P/E stays at 20, no further dilution, normalized after-tax earnings."},
{r:3,k:"calc",t:"Sample exam: discount rate",trap:1,
 c:"The 10-year Treasury fell from 4% to 2%; the sector beta rose from 1.5 to 2.0; the fund's objective is top quartile, about 25–30% on total funds.",
 q:"What discount rate should you use for this early-stage VC opportunity?",
 o:["About 40–50%","About 16%","About 25–30%","About 2%"],a:0,
 ex:"The first two bullets are mostly irrelevant: CAPM inputs were built for liquid, listed, normally distributed companies. The 25–30% target is for the whole fund, winners and losers together, so one investment must clear more. The survey average at seed is about 42%; he also cites 50%.",
 w:[null,"That's mechanical CAPM: 2% + 2.0 × ~7%. Say it and say it's far too low.","That's the fund target. A single deal needs more because winners pay for losers.","That's just the risk-free rate."],
 m:"Those models assume history, liquidity and normality; a new venture has none of them."},
{r:3,k:"fig",t:"Capital market line",fig:"cml",
 q:"Why does VC sit at about 42%?",
 o:["The premium covers systematic risk, illiquidity and the value the VC adds, at the riskiest stage","Because VCs charge 2 and 20","Because CAPM gives that number","Because the risk-free rate is high"],a:0,
 ex:"61% of VCs self-report hurdles of 20–40% and 27% report 40–60%. The target falls by stage: highest at seed, lower toward IPO."},
{r:3,k:"calc",t:"Back-solving beta",
 c:"Lego 3: risk-free 5%, market risk premium 7%. You want a 40% discount rate.",
 q:"What beta would CAPM need?",
 o:["5","2.5","5.7","0.2"],a:0,
 ex:"β = (40 − 5) ÷ 7 = 5. \"Have you ever seen a beta of 5?\" The beta is irrelevant here; CAPM was built for liquid, listed, long-history companies.",
 w:[null,"2.5 is the sector beta in the case, which gives only about 22%.","That's 40 ÷ 7, forgetting to subtract the risk-free rate.","That's the formula upside down."]},
{r:3,k:"mc",t:"Discount rate by stage",
 q:"How does the required return change as a venture matures?",
 o:["About 50% at seed, about 25% by year 5, close to CAPM by year 7","Constant at about 30%","Rises over time as the company grows","About 10% throughout"],a:0,
 ex:"Risk and data change with stage: seed, beta, customer acquisition, critical mass, IPO."},
{r:3,k:"fig",t:"Winners pay for losers",fig:"scen",
 q:"The portfolio earns 28%. Why does the VC price each deal at about 50%?",
 o:["Because most deals miss plan, each deal must be priced as if it will hit plan for the portfolio to reach ~28%","Because the fee is 50%","Because half the deals fail","Because the fund lasts 10 years"],a:0,
 ex:"Half the deals go sideways and a quarter lose money. Pricing every deal at 28% would leave the portfolio far below target.",
 m:"Winners pay for losers: a single deal's hurdle (about 40–50%) far exceeds the fund target (about 25–30%)."},
{r:3,k:"fig",t:"Time vs multiple",fig:"irr",
 q:"A deal returns 3x. What happens to the annual return if it takes 7 years instead of 3?",
 o:["It falls from about 44% to about 17%","It stays the same; the multiple is the same","It falls from about 73% to about 25%","It rises because the company is bigger"],a:0,
 ex:"Same multiple, very different IRR. Time is one of the components of return.",
 w:[null,"The multiple ignores time; IRR doesn't.","73% is 3x in 2 years and 25% is 3x in 5 years.","The multiple is fixed at 3x in both cases."]},
{r:3,k:"mc",t:"Best return",trap:1,
 q:"Which is best: 10x in 10 years, 5x in 5 years, or 2x in 2 years?",
 o:["2x in 2 years","5x in 5 years","10x in 10 years","They're all equal"],a:0,
 ex:"2x in 2 years ≈ 41%, 5x in 5 years ≈ 38%, 10x in 10 years ≈ 26%. 10x in 10 years barely beats the liquid Nasdaq (about 12–15%) for a 10-year lock-up: it \"isn't going to cut it\"."},
{r:3,k:"calc",t:"5x in 10 years",
 q:"A deal promises 5x in 10 years. Roughly what is the annual return?",
 o:["About 17%","About 50%","About 26%","About 38%"],a:0,
 ex:"He says never take it. By contrast 10x in 5 years is about 58%, which he likes.",
 w:[null,"That divides the multiple by the years (a simple return). Returns compound.","That's 10x in 10 years.","That's 5x in 5 years."]},
{r:3,k:"calc",t:"Required multiple",
 q:"What multiple do you need over 5 years to earn a 50% IRR?",
 o:["About 7.6x","About 3.5x","About 2.5x","About 5x"],a:0,
 ex:"1.5^5 ≈ 7.6. By contrast a 20% IRR over 5 years needs only about 2.5x. Compounding makes the curve convex.",
 w:[null,"That's 1 + 5 × 50%, a simple return.","That's what a 20% IRR needs over 5 years.","5x over 5 years is about 38%."]},
{r:3,k:"fig",t:"Facebook return profile",fig:"fb",
 q:"What does this table show about later rounds?",
 o:["Later rounds carry less risk and earn lower returns","Later rounds always earn the most","Angels take the least risk","Round size doesn't affect returns"],a:0,
 ex:"One of his students invested at Round A in 2012 and now owns a vineyard."},
{r:3,k:"mc",t:"The donut scenario",
 q:"Bessemer's LinkedIn memo included a $0 'donut' scenario with 0.5% probability. Why include it, and why keep it small?",
 o:["Include it for humility; keep it small or the investment committee won't give you money","It's legally required","Because the donut was the base case","To lower the valuation"],a:0,
 ex:"About 9 scenarios from $0 to $2.1B; expected multiple ~1.7x, weighted IRR ~23%. LinkedIn sold for about $26B, roughly 10x the high case: the best kind of mistake. He decides on the middle of the distribution; the tails are humility and imagination."},
{r:3,k:"mc",t:"How many scenarios",
 q:"How many valuation scenarios should you build for a start-up?",
 o:["More than 10","Three: high, base, low","One base case","Two: success or failure"],a:0,
 ex:"High, base, low, donut, home run and more. Even then they can be wrong by over 10x, as LinkedIn showed. Extreme scenario modelling has become the standard scenario."},
{r:3,k:"fig",t:"The turkey problem",fig:"turkey",trap:1,
 q:"What is the most likely next data point?",
 o:["None of these: it collapses to zero","It continues up at the same slope","It levels off","It dips slightly, then recovers"],a:0,
 ex:"It's a turkey's weight before Thanksgiving. Prediction addiction: steady history says nothing about a collapse. Examples include COVID for hotels and travel, MySpace losing 2.5M users in 3 weeks, and Theranos, FTX and WeWork going from a 100x paper mark to zero. He got this wrong in his own interview."},
{r:3,k:"mc",t:"Dangerous Excel formulas",trap:1,
 q:"Hardest assumption in modelling start-ups: constant growth (1+g)^t, the perpetuity 1/(r−g), or neither?",
 o:["Neither: none of them can be assumed","(1+g)^t","The perpetuity","Both equally"],a:0,fixed:1,
 ex:"g isn't constant and many start-ups don't survive (perpetuity = 0). r, g and t are all non-static."},
{r:3,k:"case",t:"The water-bottle trick",
 c:"A recruiter tells you: \"We're a unicorn.\"",
 q:"What should you ask?",
 o:["How much capital was actually invested, and over how many rounds?","Which unicorn index they're in","Whether they're profitable on ARR","When the IPO is"],a:0,
 ex:"Pay $1 for 0.0000001% and you have 'a unicorn'. Ask for the valuation-to-funding ratio. Each start-up has only about a 0.00006% chance of becoming a unicorn."},
{r:3,k:"mc",t:"Why unicorns multiplied",
 q:"Which was NOT one of the reasons unicorns multiplied?",
 o:["Stricter GAAP rules for private companies","FOMO","No consistent financial definitions","Everyone wants to be in the club"],a:0,
 ex:"FOMO, no consistent (non-GAAP) definitions, and ego, hiring and funding momentum. ZIRP-icorns were born of zero rates, up to two a day at the peak, and are now AI-only, with many zombies."},
{r:3,k:"mc",t:"'Fuzzy, insane math'",
 q:"How were high headline unicorn valuations often achieved (Bloomberg 2015)?",
 o:["In exchange for protective terms such as liquidation preferences and ratchets, at the expense of employees and earlier investors","By using DCF instead of comps","By lowering the discount rate","By selling more common stock"],a:0,
 ex:"\"These big numbers almost don't matter\" (Komisar, Kleiner). That's the bridge to class 4: tell me your price and I'll tell you my terms."},
{r:3,k:"mc",t:"ARR becomes 'ERR'",
 q:"Why does the professor joke that ARR has become 'ERR'?",
 o:["It's often neither annual, nor recurring, nor revenue","It's an error in GAAP","It measures expected returns","It's only used by ERP companies"],a:0,
 ex:"The new fake math. Do VCs care about profitability?"},
{r:3,k:"mc",t:"Concentration in private markets",
 q:"The Magnificent 7 are 33% of the S&P 500. What share of US unicorn value is in the AI equivalent?",
 o:["About 43%: private markets are more concentrated","About 10%","About 33%, the same","About 85%"],a:0,
 ex:"Private markets are even more concentrated than public ones."},
{r:3,k:"mc",t:"Valuations since the pandemic",trap:1,
 q:"How have private valuations changed since the pandemic?",
 o:["Higher, but only in AI","Higher across all sectors","Lower across all sectors","Flat"],a:0,
 ex:"About 85% of VC dollars go to AI; AI valuations are up 10–15x while most other sub-sectors are flat or seeing down rounds. Always answer by sector; the same applies to 'is unicorn valuation growth rising?'",
 m:"It depends on the sector and the context."},
{r:3,k:"mc",t:"What drives value",
 q:"For a given investment, value is proportional to what?",
 o:["Multiple and uncertainty, and inversely to the investment dollars needed","Revenue only","The number of investors","The founder's ownership"],a:0,
 ex:"Staging and risk matter. Value evolves: the first post-money becomes the next round's pre-money, up or down, and marks follow the latest round."},
{r:3,k:"mc",t:"Portfolio composition",
 q:"How does Fred Wilson target his portfolio?",
 o:["1/3 lose everything, 1/3 return capital, 1/3 generate the returns","80/15/5","All winners","Half and half"],a:0,
 ex:"Buffett's version: 'innovators, imitators and idiots' (Uber, Lyft, Wag, Cherry). Few VCs return more than 3x (about 12% IRR over 10 years)."},
{r:3,k:"calc",t:"The doubling penny",
 q:"$1M now, or a penny that doubles every day for 30 days?",
 o:["The penny: about $5.4M","$1M","They're about equal","The penny: about $10.7M"],a:0,
 ex:"$0.01 × 2^29 ≈ $5.4M. But the penny only passes $1M in the last 3 days. That's the power of compounding, and why survival matters.",
 w:[null,"The penny ends far higher.","The penny ends about five times higher.","That doubles 30 times instead of 29: on day 1 you already have the penny."]},
{r:3,k:"calc",t:"Lego 3: break-even",
 c:"Each county costs $15M. A home pays $50/month on a 2-year contract.",
 q:"How many homes are needed to break even?",
 o:["12,500","25,000","300,000","100,000"],a:0,
 ex:"$50 × 12 × 2 = $1,200 per home. $15M ÷ $1,200 = 12,500 homes, 12.5% of the 100,000 passed. The upside roughly doubles with $30–50 of VoIP at zero marginal cost.",
 w:[null,"That uses one year of revenue ($600) instead of the 2-year contract.","That uses one month of revenue.","That's the number of homes passed."]},
{r:3,k:"calc",t:"Lego 3: money truly at risk",
 c:"The $150 cost per home splits into $100 fixed (spectrum, marketing, network) and $50 variable (only if the home signs). A county is 100,000 homes.",
 q:"How much is truly at risk?",
 o:["About $10M","$15M","$5M","$0"],a:0,
 ex:"100,000 × $100 fixed. It still isn't a donut, because the spectrum can be resold. With $2M of cash left from the $7.5M, the raise is about $8M.",
 w:[null,"That ignores the split: the $50 is spent only if a home signs.","That's the variable part.","The spectrum protects you from a donut, but money is still at risk."]},
{r:3,k:"mc",t:"Who asked you to value it",
 q:"In Lego 3, Mr M asked you to do the valuation. Why does that matter?",
 o:["You risk negotiating with yourself","It means he trusts you completely","It saves you due diligence","It makes the valuation binding"],a:0,
 ex:"Later, on terms, he wrote the term sheet himself to anchor you."},
{r:3,k:"mc",t:"Who carries more risk",
 q:"Who carries more risk in Invisible Wires: Mr M or the VC?",
 o:["Mr M by percentage, but the VC carries career risk","Only Mr M","Only the VC","Neither; risk is shared equally"],a:0,
 ex:"Mr M has 100% of his wealth in it, but your career convexity depends on him not failing: a donut can end a career."},
{r:3,k:"mc",t:"Key driver",
 q:"What is the key driver for Invisible Wires: revenue, cost or capex?",
 o:["All of them","Revenue","Cost","Capex"],a:0,fixed:1,
 ex:"Revenue captures the upside; cost and capex set the size of the donut."},
{r:3,k:"cmt",t:"Disclosing the VoIP upside",
 c:"You've found $30–50/month of VoIP revenue at no extra cost. Mr M never mentioned it. Your partner says: \"Never disclose it; it only raises his valuation.\"",
 q:"What did the professor do, and why?",
 o:["He disclosed it to build trust, because something smelled funny; it earned 5+ deals over 20 years","He kept it secret for leverage","He used it to demand more equity","He walked away from the deal"],a:0,
 ex:"Mr M replied the technology wouldn't support it for about 5 years. Lesson: build the scenarios first, then decide how much to disclose. Trust is the long-game asset in a word-of-mouth business.",
 w:[null,"That's what most students would do, and what his partner screamed for.","That would have destroyed the trust he was building.","The finding raised the deal's upside; there was no reason to walk."]},
{r:3,k:"fig",t:"Lego 3: the negotiating zone",fig:"iw",
 q:"Why does the VC's base case use about 8x revenue for the exit multiple when Moto trades at 4–5x?",
 o:["Invisible Wires is growing faster than Moto","Telcos trade at 8x","Mr M asked for it","To lower the valuation"],a:0,
 ex:"The model gives an NPV of about $20.3M and, by the VC method, about 38% ownership for $8M (about 4.8x the money). The ranges from both sides form the negotiating zone."},

/* ───────── Class 4 ───────── */
{r:4,k:"mc",t:"What a term sheet is",
 q:"What is a term sheet, in the professor's words?",
 o:["Legal scenario analysis about the future","The final purchase agreement","A valuation model","A board resolution"],a:0,
 ex:"Excel scenarios are financial (high, base, low); a term sheet does the same in words (up round, flat, down round). It provides signaling, intent and negotiation parameters."},
{r:4,k:"tf",t:"Is it the final document?",o:TF,a:1,
 q:"True or false: the term sheet is the final legal document.",
 ex:"The purchase and sale agreement, amended charter and articles, and share transfer follow, typically 2–4 weeks later."},
{r:4,k:"mc",t:"The no-shop clause",
 q:"How binding is a 'no-shop' clause?",
 o:["It's a moral, not legal, obligation","Fully enforceable in court","It's illegal","It binds only the VC"],a:0,
 ex:"Founders do shop term sheets. He caught one through his own unique 'fingerprint' clause and pulled the deal."},
{r:4,k:"mc",t:"What a term sheet covers",
 q:"A term sheet focuses on the current round, future up rounds, future down rounds, or all?",
 o:["All of the above","Current round","Future up rounds","Future down rounds"],a:0,fixed:1,
 ex:"It's legal scenario analysis across every future state."},
{r:4,k:"mc",t:"East vs West Coast",
 q:"How do East Coast and West Coast VCs differ in what they focus on?",
 o:["East Coast on anti-dilution; West Coast on tag-along and pro rata","East on pro rata; West on anti-dilution","East on board seats; West on price","No difference"],a:0,
 ex:"East Coast firms come from Wall Street and were burned by blow-ups."},
{r:4,k:"case",t:"Price vs terms",
 c:"In 2023 Microsoft accepted OpenAI's price, $10B at a $29B valuation, with no negotiation. Instead it took 75% of OpenAI's profits until it recouped $10B, then 49% up to a cap, and commercial use ran through Microsoft's platform.",
 q:"Which matters more in a VC deal, price or legal terms?",
 o:["Legal terms","Price","Equal","Neither; relationships matter only"],a:0,
 ex:"\"Tell me your price and I'll tell you my terms.\" Outcomes are nearly binomial. The terms were so onerous that OpenAI later renegotiated once leverage shifted. In hedge fund or PE classes people pick price.",
 w:[null,"Microsoft didn't even negotiate the price; the value was in the terms.","The terms decided who gets what in every scenario.","Terms and relationships both matter, but the poll answer is legal terms."]},
{r:4,k:"mc",t:"Up rounds in name only",
 q:"Tonal, Jokr and Acorns raised at higher headline valuations in 2022. What was the catch?",
 o:["They guaranteed investors up to 2x their money in a downside","They gave up board control","They had to IPO within a year","Nothing; they were real up rounds"],a:0,
 ex:"'Up rounds in name only'. Klarna, by contrast, took an honest down round at −85%."},
{r:4,k:"mc",t:"Mapping terms to scenarios",
 q:"Which term addresses the up-round scenario?",
 o:["Pro rata rights","Anti-dilution","Liquidation preference","Negative covenants"],a:0,
 ex:"Valuation covers the current round; anti-dilution covers a down round; capitalization, board rights, information rights, transferability and employee options cover all scenarios. Pro rata = upside clause; anti-dilution = downside clause."},
{r:4,k:"fig",t:"Payoff diagrams",fig:"payoff",
 q:"Which line is convertible preferred stock?",
 o:["Line A","Line B","Line C"],a:1,fixed:1,
 ex:"It rises with protection, goes flat (you hold the conversion option but haven't exercised it), then rises again after conversion: downside protection plus unlimited upside.",
 w:["Line A is straight preferred: protected, but the upside is capped like debt. You never want this in VC.",null,"Line C is common stock: a 45-degree line with equal rights all along."]},
{r:4,k:"mc",t:"Which security VCs use",
 q:"Which security is used in about 90–98% of VC deals?",
 o:["Convertible preferred","Common","Straight preferred","Venture debt"],a:0,
 ex:"Common is about 2% (mostly angel deals). Convertible preferred is forced into common at IPO by law, or on the conditions in the documents."},
{r:4,k:"mc",t:"Double dipping",
 q:"With convertible preferred, do you get both the downside triangle and the upside triangle?",
 o:["No: they're mutually exclusive","Yes, always","Only in an IPO","Only with a participating clause"],a:0,
 ex:"The company is at one valuation at a time, and once you convert you give up the preference. Theranos and WeWork investors converted voluntarily to look loyal and lost the downside triangle when value collapsed."},
{r:4,k:"cmt",t:"Fixating on triangles",
 c:"A founder keeps insisting: \"It's not fair that you get both triangles.\"",
 q:"What does the professor read into this?",
 o:["Ask what they know that you don't: fixating on the downside is a behavioral tell","Nothing; it's a fair point","They're inexperienced, so ignore it","Agree and drop the preference"],a:0,
 ex:"\"After that conversation, we never talked about triangles again.\""},
{r:4,k:"calc",t:"Liquidation preference",
 c:"You invest $100 with a 1x liquidation preference. The company fails, and only $20 remains (from selling the spectrum).",
 q:"What do you get?",
 o:["$20, ahead of common: not a donut","$0","$100","Your % share of the $20"],a:0,
 ex:"20 cents on the dollar. Structure turned a donut into a partial recovery.",
 w:[null,"The preference puts you first in line for what's left.","A 1x preference caps your claim at $100, but there's only $20.","That's what common holders get. The preference puts you ahead of them."]},
{r:4,k:"mc",t:"The capital stack",
 q:"When does venture debt appear above preferred in the capital stack?",
 o:["Around rounds C/D, once there are cash flows to pay interest","At seed","Never","Only at IPO"],a:0,
 ex:"Later investors (C, D, E) also often negotiate seniority over A and B, because they have more money and better lawyers."},
{r:4,k:"mc",t:"Control is not the point",
 q:"Why does PE need 51%+ control while VC doesn't?",
 o:["PE loads debt on the balance sheet and must control free cash flow to service it","PE invests smaller amounts","VC is legally barred from control","PE deals are riskier"],a:0,
 ex:"VC is about securing upside and protecting downside, not control. In typical deals, over 60% of boards have neither a VC nor a founder majority."},
{r:4,k:"case",t:"Seizing control",
 c:"A start-up is struggling. A board member suggests the VC takes control and replaces the founder.",
 q:"Is that a good way for the VC to protect itself?",
 o:["Rarely: there's no cash flow to control, and the team, suppliers and customers may walk","Yes: control always protects the downside","Yes, if the VC holds over 50%","Only in an up round"],a:0,
 ex:"It can be a self-inflicted bankruptcy; Sam Altman's ouster nearly imploded OpenAI. The exception is valuable intangibles such as patents or spectrum, worth seizing when a company fails. Incentivizing management is vital, so preferred stock is used instead of control."},
{r:4,k:"tf",t:"What anti-dilution protects",o:TF,a:1,trap:1,
 q:"True or false: anti-dilution clauses protect your ownership percentage whenever new shares are issued.",
 ex:"They protect economic value (shares × price per share), not your percentage, and only a down round triggers them. This was the 2 marks the student missed on the sample question.",
 m:"Economic dilution, not ownership dilution."},
{r:4,k:"fig",t:"The up round",fig:"anti",
 q:"In the up round, VC-A's stake falls from 20% to 18%. Does anti-dilution trigger?",
 o:["No: it's ownership dilution with no economic dilution","Yes: its percentage fell","Yes, but only weighted average","Only if VC-B demands it"],a:0,
 ex:"VC-A's stake is worth $360, up from $200. Anti-dilution protects value, so nothing triggers."},
{r:4,k:"fig",t:"Full ratchet",fig:"anti",
 q:"A full ratchet restores VC-A to $200 in the down round. Where do the extra shares come from?",
 o:["The founder: 72% → 50%","VC-B","The option pool","Newly authorized shares that dilute no one"],a:0,
 ex:"Founder motivation collapses, VC-A gains power over VC-B, and VC-B may walk. A full ratchet ('like Halloween's hatchet') is the most egregious form.",
 w:[null,"VC-B keeps its 10%.","The table shows the founder's stake falling.","Every new share dilutes someone."]},
{r:4,k:"mc",t:"Weighted average",
 q:"In the same down round, where does a weighted-average clause leave VC-A's stake value?",
 o:["Between $90 and $200, typically about $110–130","Exactly $200","Exactly $90","Above $360"],a:0,
 ex:"It's a compromise between VC-A and VC-B."},
{r:4,k:"mc",t:"Are ratchets enforced?",
 q:"Are full ratchets usually enforced?",
 o:["No: 64% of VCs waive them to prevent liquidation","Yes, always","Only by East Coast firms","Only in IPOs"],a:0,
 ex:"Enforcing kills the new round you aren't willing to fund, which likely means liquidation. \"18% of something beats 40% of nothing.\" You're never forced to exercise a right; having it gives you leverage to renegotiate."},
{r:4,k:"mc",t:"Down rounds today",trap:1,
 q:"Are down rounds more prevalent today?",
 o:["It depends on the sector","Yes, everywhere","No, they've disappeared","Only in AI"],a:0,
 ex:"There are many outside the AI 'Magnificent 7', including many inside AI. They were nearly absent 2009–2021 (QE), mattered in 2022–23, and continued through 2024–25; some analysts today have never seen one."},
{r:4,k:"mc",t:"Pro rata",
 q:"What is a pro rata right?",
 o:["The right, not the obligation, to invest in future rounds to keep your ownership %","An obligation to invest in every round","A guarantee of a board seat","Protection against a down round"],a:0,
 ex:"It's often called the second most important term after price. Fred Wilson: \"Pro rata rights are a must.\" Without a written clause, no one has to invite you back."},
{r:4,k:"calc",t:"Keeping your 1%",
 c:"You invested $50K at a $5M cap for 1%. The next round raises $3M at $9M pre / $12M post.",
 q:"How much must you invest to stay at 1%?",
 o:["$30K","$50K","$120K","$22.5K"],a:0,
 ex:"Without participating you fall to 0.75% (9/12 of 1%, a 25% dilution). Buying 1% of the $3M round, $30K, keeps you at 1%.",
 w:[null,"That repeats your original check; you only need 1% of the new money.","That's 1% of the whole $12M company. You already own most of your 1%.","That's 0.75% of the round."]},
{r:4,k:"mc",t:"Not exercising pro rata",
 q:"Why might a VC not exercise its pro rata right?",
