 o:["The fund is running out of capital, or it disagrees with the valuation","It's illegal after Series B","It always exercises","Founders can block it"],a:0,
 ex:"His $75M fund was down to $3M and couldn't follow on. AngelList-style diversification says pro rata matters less; large GPs say you'll be squeezed out of your winners without it."},
{r:4,k:"mc",t:"The key missing term",trap:1,
 q:"The key missing term in a term sheet: pro rata, anti-dilution or the options pool?",
 o:["Pro rata since 2010; anti-dilution before 2010","Anti-dilution, always","Options pool","None matter"],a:0,
 ex:"Rising valuations made upside clauses dominant; falling valuations made downside clauses dominant. The class majority said anti-dilution. Context and year decide."},
{r:4,k:"fig",t:"Dilution by round",fig:"dilution",
 q:"Is dilution highest early or late?",
 o:["Early: the riskiest rounds give up the most","Late: bigger rounds dilute more","Constant across rounds","Only at IPO"],a:0,
 ex:"Seed 21%, A 24%, B 18%, C 14.5%, D 11%. Dilution fell from 2019 to 2021 as more capital chased deals."},
{r:4,k:"mc",t:"Normal dilution",
 q:"Rule of thumb (Leo Polovets): how much dilution is normal at pre-seed or seed?",
 o:["About 20% is normal, 30% is OK, 50%+ is crazy","About 50%","Under 5%","About 75%"],a:0,
 ex:"Big early dilution damages founder motivation, which is human capital."},
{r:4,k:"mc",t:"The option pool shuffle",
 q:"Does the employee options pool affect valuation?",
 o:["Yes: VCs build it into the pre-money, so the price per share is lower","No: it's separate from valuation","Only at IPO","Only for common holders"],a:0,
 ex:"The dollar valuation looks the same, but the price per share is lower. Without options, no one joins a risky start-up; they're usually granted by about year 2."},
{r:4,k:"case",t:"Joining a start-up",
 c:"You're offered options at a start-up.",
 q:"What should you ask?",
 o:["\"Is my share class the same as the founders'?\" phrased as \"How will future dilution events affect my position?\"","\"What's the valuation?\"","\"When is the IPO?\"","\"Who are the VCs?\""],a:0,
 ex:"Former students at Zynga and WeWork got common while founders held preferred."},
{r:4,k:"mc",t:"Reading a cap table",
 q:"A cap table has three layers. What are they?",
 o:["The math, the law and the story","Assets, liabilities and equity","Seed, growth and exit","Common, preferred and options"],a:0,
 ex:"It shows ownership, key players, pro rata, economic rights, the liquidation-preference stack and voting."},
{r:4,k:"mc",t:"Red flags",
 q:"Which red flag appears on both the entrepreneur's and the VC's lists?",
 o:["A corporate strategic investor","Under-financing","Unwillingness to report","Weak board composition"],a:0,
 ex:"Its motive may be the technology, not the return. Also avoid one-sidedness and milestones that become a leash, such as weekly reports or liquidation for a missed four-week target.",
 w:[null,"That's only on the entrepreneur's list.","That's only on the VC's list.","That's only on the VC's list."]},
{r:4,k:"case",t:"Airbnb 2011",
 c:"In a $1.2B round, Airbnb's founders took a $22.5M dividend to common, $21M to themselves, excluding option-holding employees.",
 q:"Why did Chamath pass?",
 o:["Liquidity for founders only: \"If you want liquidity, make it available to everyone\"","The valuation was too low","He disliked the travel sector","The founders refused a board seat"],a:0,
 ex:"It's a red flag about how founders treat employees and other holders."},
{r:4,k:"calc",t:"Lego 4: the round",
 c:"The VC invests $8M for 40%.",
 q:"What are the post-money and pre-money?",
 o:["Post $20M, pre $12M","Post $20M, pre $28M","Post $8M, pre $12M","Post $32M, pre $20M"],a:0,
 ex:"8 ÷ 0.4 = $20M; 20 − 8 = $12M. The prior pre-money was $7.5M, so the price rose 60% in 8 months, which is normal at seed. If you dislike it, walk away.",
 w:[null,"Pre-money is post minus the investment.","Post-money is the investment divided by the stake.","That treats 40% as the pre-money stake."]},
{r:4,k:"calc",t:"Lego 4: 40% vs 45%",
 c:"Mr M owns 80% before the round. Your partner suggests taking 45% instead of 40%.",
 q:"What would Mr M's stake be?",
 o:["44%","48%","35%","40%"],a:0,
 ex:"80% × 55% = 44%, versus 80% × 60% = 48% at 40%. For every point you take, he loses 0.8. At 44% the VC would hold the most shares, which damages the founder psychologically at the toddler stage even though he still runs the company. The extra 5% looks good in Excel but harms human capital.",
 w:[null,"That's his stake if you take 40%.","That subtracts 45 from 80, but he's diluted proportionally.","That's not the calculation; his 80% is diluted by the 45% sold."]},
{r:4,k:"mc",t:"Who wrote the term sheet",
 q:"Mr M wrote the term sheet himself. Why does that matter?",
 o:["He anchors you; you must find the omitted terms, not only fix the existing ones","It means it's fair","It means it's final","It saves legal fees"],a:0,
 ex:"In valuation he let you lead, so you negotiated with yourself; on terms he leads. Hire experienced lawyers and keep a 'dummy' term sheet of all clauses to check against."},
{r:4,k:"mc",t:"Fixing 'common shares'",
 q:"Mr M's draft offers common shares at $1.00 par. What should you ask for instead?",
 o:["Convertible preferred with a liquidation preference up to the $20M agreed value, then 40% of the upside","More common shares","Debt with warrants","Straight preferred"],a:0,
 ex:"He shouldn't object if he believes the company is worth more. Cumulative dividends were also suggested."},
{r:4,k:"mc",t:"Fixing information rights",
 q:"The draft gives you an annual audited report. What's the fix?",
 o:["Monthly unaudited operating reports plus inspection rights and access to management, books and plans","Quarterly audited reports","Nothing; annual is standard","A second board seat"],a:0,
 ex:"Audits are too slow for a start-up."},
{r:4,k:"mc",t:"Omitted clauses",
 q:"Which of these was NOT in Mr M's draft and must be added?",
 o:["Anti-dilution","Board: nominate 2 of 5","Right of first refusal","Options pool up to 1M shares"],a:0,
 ex:"Also omitted: use of proceeds (primary issue, used in the business), milestones, key-man insurance, salary and non-competes, pro rata, protective provisions and ring-fencing of new projects (the Hotmail lesson).",
 w:[null,"It's in the draft; just clarify that 'nominate' means 'appoint'.","It's in the draft and fair.","It's in the draft (about 5% dilution); specify vesting and strike."]},
{r:4,k:"fig",t:"Assignment 3: Alpha vs Mega",fig:"alpha",
 q:"At a $10M liquidation, which term sheet is better for the founders?",
 o:["Alpha: about $3.0M versus about $1.5M under Mega","Mega: it has no escrow","They pay the same","Mega: its pre-money is lower"],a:0,
 ex:"Above about $30M, Alpha's 3x cap makes it clearly better. Most students picked Alpha; others picked Mega for control. There's no single right answer: the grade is in the reasoning.",
 w:[null,"Mega avoids escrow, but its 1.25x preference, cumulative dividends and full participation take more of a small exit.","The payouts differ a lot because of the preference terms.","A lower pre-money is worse for founders, not better."]},
{r:4,k:"fig",t:"Assignment 2b: Hotmail rounds",fig:"hot",
 q:"Which is a common mistake in the Series D call/put calculation?",
 o:["Thinking a put returns money to the VC","Using Round C's post-money shares as the starting point","Remembering that post-money = pre-money + new money","Calculating cumulative VC %"],a:0,
 ex:"A put doesn't return money; it strikes the price lower. Only one of call or put triggers, so both start from Round C's post-money shares. Term sheets get more complex with every round, especially when the exit is delayed.",
 w:[null,"That's the correct approach, not the mistake.","That's correct; forgetting it is the mistake.","That's part of the correct answer."]},
{r:4,k:"mc",t:"After investing",
 q:"What is the hardest decision after investing: marketing, personnel or financing?",
 o:["Personnel","Marketing","Financing","None; the hard part is over"],a:0,
 ex:"People are the asset. Interventions include CEO changes; Google's founders took the CEO role only later, and Dell's and Starbucks' founders returned. \"The hardest thing to manage in a crisis isn't your company, it's your own psychology\" (Brian Chesky)."},
{r:4,k:"mc",t:"Quarterly review",
 q:"In the quarterly portfolio review, what does PTS stand for?",
 o:["Performance, team, scalability","Price, terms, structure","Pivot, traction, sales","Profit, tax, savings"],a:0,
 ex:"Deals are ranked on PTS, revenue, performance against budget, value against revenue and IRR to date. The bottom quartile gets extra attention."},
{r:4,k:"mc",t:"Pivots",
 q:"How often do surviving start-ups pivot?",
 o:["Reportedly over 50% of the time","Rarely","Never, if well run","Only after a down round"],a:0,
 ex:"Netflix (DVD to streaming), Slack (game to workplace chat), Nintendo (cards to consoles), Western Union (telegram to money transfer)."},
{r:4,k:"tf",t:"Highest first valuation",o:TF,a:1,
 q:"True or false: getting the highest possible first-round valuation is always good for the founder.",
 ex:"It sets expectations, and a later down round triggers anti-dilution."},

/* ───────── Class 5 ───────── */
{r:5,k:"mc",t:"Most common exit",trap:1,
 q:"What is the most common VC exit?",
 o:["Liquidation","M&A","IPO","Secondary sale"],a:0,
 ex:"About 80% fail. Successful exits are M&A or IPO."},
{r:5,k:"mc",t:"Generating vs realizing",
 q:"What is the difference between generating and realizing a return?",
 o:["Generating = unrealized marks set by GPs and auditors; realizing = cash from an exit","They're the same","Generating = cash; realizing = marks","Generating applies only to IPOs"],a:0,
 ex:"The fund lives only 10 years, so every position must be turned from a mark into cash. Judging an exit requires knowing the entry, the basis, the sector and the exit type."},
{r:5,k:"fig",t:"Vintage matters",fig:"vintage",
 q:"Why did funds started just before the bubble do so well?",
 o:["They sold into the bubble","They invested at the peak","They avoided tech","They used more leverage"],a:0,
 ex:"Funds started at the dot-com peak bought high. Funds started in 2022 are in trouble unless they hold AI winners."},
{r:5,k:"mc",t:"Why marks and exits diverge",
 q:"Which is NOT one of the four sources of discrepancy between marks and exit values?",
 o:["Stricter audit rules for private companies","Crowding and minimal due diligence","New accounting metrics","Exit math: time and liquidity"],a:0,
 ex:"The four: crowding (near 1999 levels; megafunds must deploy), new accounting metrics, new estimates of private value, and exit math (time and liquidity)."},
{r:5,k:"case",t:"Adjusted metrics",
 c:"WeWork reported 'community-adjusted EBITDA', which stripped out rent. Today some AI companies report 'EBTITDA': earnings before training.",
 q:"What is the professor's point?",
 o:["It's legal if footnoted as 'adjusted', so read the footnotes","It's illegal and will be prosecuted","It's standard GAAP","It doesn't affect valuation"],a:0,
 ex:"Removing compute costs turns losses positive. He laughed in the WeWork meeting and said no at $26B, watched it reach $40B, then collapse. \"When you were right but everyone thought you were wrong, no one will say anything.\""},
{r:5,k:"mc",t:"What a round prices",
 q:"What does a new funding round actually price?",
 o:["Only the marginal share, not liquidity for all shares","The whole company at a liquid price","The founders' shares only","The IPO price"],a:0,
 ex:"That's one reason marks can diverge from exit values. Perpetual and pre-IPO tools are emerging."},

/* ───────── Engine ───────── */
const KEY="nvf-practice-v1";
let state={answers:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null");if(s&&s.answers)state=s}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}

const app=document.getElementById("app");
let queue=[],pos=0,order=null,picked=null,mode="round";

function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function R(n){return ROUNDS.find(r=>r.n===n)}
function rlabel(n){return n===0?"Core":"Class "+n}
function roundQs(n){return Q.filter(q=>q.r===n)}
function roundScore(n){const qs=roundQs(n);const done=qs.filter(q=>q.id in state.answers);return {done:done.length,total:qs.length,ok:done.filter(q=>state.answers[q.id]).length}}

/* figures */
function fmt(v,u){const s=(Math.round(v*10)/10).toLocaleString("en-US");return u==="%"?s+"%":u==="bp"?s+"bp":s}
function figHTML(f){
  if(typeof f==="string")f=F[f];
  if(!f)return "";
  let body="";
  if(f.type==="bars"){
    body=`<div class="bars">${f.rows.map(r=>`<div class="brow${r[2]?" hl":""}"><span class="bl">${esc(r[0])}</span><span class="track"><i style="width:${Math.max(0.5,r[1]/f.max*100)}%"></i></span><span class="bv">${fmt(r[1],f.unit)}</span></div>`).join("")}</div>`;
  }else if(f.type==="table"){
    body=`<div class="tbl"><table><thead><tr>${f.head.map(h=>`<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${f.rows.map((r,i)=>`<tr${(f.hl||[]).includes(i)?' class="hl"':""}>${r.map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  }else if(f.type==="line"){
    body=lineSVG(f);
  }
  return `<figure class="fig" style="margin:0"><span class="ftitle">${esc(f.title)}</span>${body}${f.note?`<span class="fnote">${esc(f.note)}</span>`:""}</figure>`;
}
function lineSVG(f){
  const W=600,H=330,L=62,Rm=20,T=24,B=60,pw=W-L-Rm,ph=H-T-B;
  const X=x=>L+(x-f.xmin)/(f.xmax-f.xmin)*pw, Y=y=>T+(f.ymax-y)/(f.ymax-f.ymin)*ph;
  let g=`<line class="ax" x1="${L}" y1="${T+ph}" x2="${L+pw}" y2="${T+ph}"/><line class="ax" x1="${L}" y1="${T}" x2="${L}" y2="${T+ph}"/>`;
  if(f.zero)g+=`<line class="zero" x1="${L}" y1="${Y(0)}" x2="${L+pw}" y2="${Y(0)}"/>`;
  (f.xt||[]).forEach(([x,l])=>{g+=`<text x="${X(x)}" y="${T+ph+26}" text-anchor="middle">${esc(l)}</text>`});
  (f.yt||[]).forEach(([y,l])=>{g+=`<text x="${L-10}" y="${Y(y)+6}" text-anchor="end">${esc(l)}</text>`});
  g+=`<text x="${L+pw/2}" y="${H-4}" text-anchor="middle">${esc(f.xlab)}</text>`;
  g+=`<text transform="translate(20 ${T+ph/2}) rotate(-90)" text-anchor="middle">${esc(f.ylab)}</text>`;
  f.series.forEach(s=>{
    const d=s.pts.map((p,i)=>(i?"L":"M")+X(p[0]).toFixed(1)+" "+Y(p[1]).toFixed(1)).join(" ");
    g+=`<path d="${d}" fill="none" stroke="var(--${s.c})" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>`;
    const e=s.pts[s.pts.length-1];
    if(f.series.length>1)g+=`<text class="sl" x="${X(e[0])-6}" y="${Y(e[1])-12}" text-anchor="end" style="fill:var(--${s.c})">${esc(s.name)}</text>`;
  });
  if(f.dot){const last=f.series[0].pts.at(-1);g+=`<text class="sl" x="${X(f.dot[0])}" y="${Y(last[1])+4}" text-anchor="middle" style="fill:var(--s2)">${esc(f.dot[1])}</text>`}
  return `<div class="svgwrap"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(f.title)}">${g}</svg></div>`;
}

function home(){
  const answered=Object.keys(state.answers).length;
  const next=ROUNDS.find(r=>roundScore(r.n).done<roundScore(r.n).total);
  const traps=Q.filter(q=>q.trap).length;
  app.innerHTML=`
    <div class="intro">
      <span class="label">New Venture Financing · Midterm prep</span>
      <h1>NVF Practice</h1>
      <p class="muted">${Q.length} questions built from the lecture notes, Invisible Wires, the assignments and every poll. Each question covers a different idea, so one pass covers the whole course. After each answer you get the reasoning, why your pick was wrong, and the line that earns marks.</p>
    </div>
    <div class="rounds">
      ${ROUNDS.map(r=>{const s=roundScore(r.n);const status=s.done===s.total?`<span class="pill done num">${s.ok}/${s.total}</span>`:s.done?`<span class="pill todo num">${s.done}/${s.total} done</span>`:`<span class="pill todo num">${s.total} questions</span>`;
        return `<button class="round" data-r="${r.n}"><span class="rn">${rlabel(r.n)}</span><span class="rt">${r.title}</span><span class="rscore">${status}</span><span class="rs">${r.sub}</span></button>`}).join("")}
    </div>
    <div class="row">
      ${next?`<button class="btn" id="go">${answered?"Continue: "+R(next.n).title:"Start with core ideas"}</button>`:`<button class="btn" id="results">See results</button>`}
    </div>
    <div class="modes">
      <button class="mode" id="mix"><b>Mixed 20</b><small>Random questions you haven't answered yet</small></button>
      <button class="mode" id="traps"><b>Traps only</b><small>${traps} questions most of the class got wrong</small></button>
      ${answered?`<button class="mode" id="results2"><b>Results</b><small>${answered} of ${Q.length} answered</small></button>`:""}
    </div>
    ${answered?`<div class="row" id="resetrow"><button class="btn secondary" id="reset">Start over</button></div>`:""}`;
  app.querySelectorAll(".round").forEach(b=>b.onclick=()=>startRound(+b.dataset.r));
  const go=document.getElementById("go");if(go)go.onclick=()=>startRound(next.n,true);
  ["results","results2"].forEach(id=>{const b=document.getElementById(id);if(b)b.onclick=results});
  document.getElementById("mix").onclick=startMix;
  document.getElementById("traps").onclick=startTraps;
  const re=document.getElementById("reset");if(re)re.onclick=confirmReset;
  window.scrollTo(0,0);
}

function confirmReset(){
  const row=document.getElementById("resetrow");
  row.outerHTML=`<div class="confirm" id="resetrow"><p>Clear all answers and start from the beginning?</p><div class="row"><button class="btn" id="yes">Clear and restart</button><button class="btn secondary" id="no">Cancel</button></div></div>`;
  document.getElementById("yes").onclick=()=>{state={answers:{}};save();home()};
  document.getElementById("no").onclick=home;
}

function startRound(n,resume){
  mode="round";
  let qs=roundQs(n);
  if(resume){const left=qs.filter(q=>!(q.id in state.answers));if(left.length)qs=left}
  queue=qs;pos=0;show();
}
function startMix(){
  mode="mix";
  const fresh=shuffle(Q.filter(q=>!(q.id in state.answers)));
  queue=(fresh.length>=20?fresh:fresh.concat(shuffle(Q.filter(q=>q.id in state.answers)))).slice(0,20);
  pos=0;show();
}
function startTraps(){mode="traps";queue=shuffle(Q.filter(q=>q.trap));pos=0;show()}
function startRetry(){mode="retry";queue=Q.filter(q=>state.answers[q.id]===false);pos=0;show()}

const KIND={tf:"True or false",mc:"Concept",case:"Case",cmt:"Evaluate the comment",calc:"Calculation"};
function kindOf(q){if(q.k==="fig"){const f=typeof q.fig==="string"?F[q.fig]:q.fig;return f.type==="table"?"Table":"Graph"}return KIND[q.k]}

function show(){
  const q=queue[pos];picked=null;
  const idx=q.o.map((_,i)=>i);
  order=q.k==="tf"?idx:q.fixed?(q.a===0?idx.slice(1).concat(0):idx):shuffle(idx); /* fixed lists keep "All/Both/None" answers last */
  const label={retry:"Retry missed",mix:"Mixed practice",traps:"Trap questions"}[mode]||`${rlabel(q.r)} · ${R(q.r).title}`;
  app.innerHTML=`
    <div class="top">
      <div class="topline"><span class="label">${label}</span><button class="link" id="exit">Exit</button></div>
      <div class="bar" aria-hidden="true"><i style="width:${(pos/queue.length)*100}%"></i></div>
      <span class="label num">Question ${pos+1} of ${queue.length}</span>
    </div>
    <div class="qcard">
      <div class="kindrow"><span class="kind">${kindOf(q)}</span><span class="topic">${esc(q.t)}${mode!=="round"?" · "+rlabel(q.r):""}</span>${q.trap?`<span class="trap">Trap</span>`:""}</div>
      ${q.fig&&q.k==="fig"?figHTML(q.fig):""}
      ${q.c?`<p class="case">${esc(q.c)}</p>`:""}
      <p class="qtext">${esc(q.q)}</p>
      <div class="opts" role="group" aria-label="Answers">
        ${order.map(oi=>`<button class="opt" data-i="${oi}"><span>${esc(q.o[oi])}</span></button>`).join("")}
      </div>
      <div id="fb"></div>
    </div>`;
  document.getElementById("exit").onclick=home;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.i));
  window.scrollTo(0,0);
}

function answer(i){
  if(picked!==null)return;
  const q=queue[pos];picked=i;const ok=i===q.a;
  state.answers[q.id]=ok;save();
  app.querySelectorAll(".opt").forEach(b=>{b.disabled=true;const bi=+b.dataset.i;
    if(bi===q.a)b.classList.add("correct");else if(bi===i)b.classList.add("wrong");else b.classList.add("dim")});
  const last=pos===queue.length-1;
  const nextLabel=last?(mode==="round"?"Finish section":"See results"):"Next question";
  const why=!ok&&q.w&&q.w[i]?`<p class="why"><b>Why not "${esc(q.o[i])}":</b> ${esc(q.w[i])}</p>`:"";
  document.getElementById("fb").innerHTML=`
    <div class="feedback ${ok?"ok":"bad"}" role="status">
      <span class="verdict">${ok?"Correct":"Not quite. Answer: "+esc(q.o[q.a])}</span>
      <p>${esc(q.ex)}</p>
      ${why}
      ${q.m?`<p class="mark"><b>Line that earns marks:</b> “${esc(q.m)}”</p>`:""}
    </div>
    <div class="row" style="margin-top:16px"><button class="btn" id="next">${nextLabel}</button></div>`;
  const nb=document.getElementById("next");nb.onclick=next;nb.focus({preventScroll:true});
  document.getElementById("fb").scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"nearest"});
}

function next(){
  if(pos<queue.length-1){pos++;show();return}
  if(mode!=="round"){results();return}
  roundEnd(queue[pos].r);
}

function roundEnd(n){
  const s=roundScore(n);const r=R(n);
  const missed=roundQs(n).filter(q=>state.answers[q.id]===false);
  const nxt=ROUNDS.find(x=>x.n>n&&roundScore(x.n).done<roundScore(x.n).total)||ROUNDS.find(x=>roundScore(x.n).done<roundScore(x.n).total);
  app.innerHTML=`
    <div class="intro">
      <span class="label">${rlabel(n)} complete</span>
      <h2>${r.title}</h2>
    </div>
    <div class="score num">${s.ok}<span class="muted" style="font-size:1.5rem"> / ${s.total}</span></div>
    ${missed.length?`<div class="intro"><span class="label">Review these</span><ul class="review">${missed.map(q=>`<li><b>${esc(q.t)}</b><small>${esc(q.ex)}</small></li>`).join("")}</ul></div>`:`<p class="clear">Clean section. Nothing to review here.</p>`}
    <div class="row">
      ${nxt?`<button class="btn" id="cont">Continue: ${esc(nxt.title)}</button>`:`<button class="btn" id="res">See final results</button>`}
      <button class="btn secondary" id="home">Back to sections</button>
    </div>`;
  const c=document.getElementById("cont");if(c){c.onclick=()=>startRound(nxt.n,true);c.focus({preventScroll:true})}
  const rs=document.getElementById("res");if(rs){rs.onclick=results;rs.focus({preventScroll:true})}
  document.getElementById("home").onclick=home;
  window.scrollTo(0,0);
}

function results(){
  const done=Q.filter(q=>q.id in state.answers);const ok=done.filter(q=>state.answers[q.id]).length;
  const missed=Q.filter(q=>state.answers[q.id]===false);
  app.innerHTML=`
    <div class="intro"><span class="label">Results</span><h2>All sections</h2></div>
    <div class="score num">${ok}<span class="muted" style="font-size:1.5rem"> / ${Q.length}</span></div>
    <div class="table">
      ${ROUNDS.map(r=>{const s=roundScore(r.n);return `<div class="trow"><span>${rlabel(r.n)} · ${r.title}</span><span class="num">${s.done?s.ok+" / "+s.total:"not started"}</span></div>`}).join("")}
    </div>
    ${missed.length?`<div class="intro"><span class="label">Topics to review (${missed.length})</span><ul class="review">${missed.map(q=>`<li><b>${esc(q.t)}</b><small>${rlabel(q.r)}. ${esc(q.ex)}</small></li>`).join("")}</ul></div>`:(done.length===Q.length?`<p class="clear">Every question answered correctly. You're ready.</p>`:"")}
    <div class="row">
      ${missed.length?`<button class="btn" id="retry">Retry ${missed.length} missed</button>`:""}
      <button class="btn secondary" id="home">Back to sections</button>
    </div>`;
  const rt=document.getElementById("retry");if(rt)rt.onclick=startRetry;
  document.getElementById("home").onclick=home;
  window.scrollTo(0,0);
}

home();
</script>
</body>
</html>
